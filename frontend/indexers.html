/* =========================== HELPERS ========================= */
function detectMagic(bytes){
  for(var i=0;i<MAGIC.length;i++){
    var m=MAGIC[i], ok=true;
    for(var j=0;j<m.sig.length;j++) if(bytes[j]!==m.sig[j]){ ok=false; break; }
    if(ok) return m;
  }
  return null;
}
function entropy(bytes){
  if(!bytes || !bytes.length) return 0;
  var freq=new Array(256); for(var i=0;i<256;i++) freq[i]=0;
  for(var k=0;k<bytes.length;k++) freq[bytes[k]]++;
  var H=0, len=bytes.length;
  for(var f=0;f<256;f++){ if(!freq[f]) continue; var p=freq[f]/len; H-=p*Math.log(p)/Math.LN2; }
  return H;
}
function stringEntropy(s){
  if(!s) return 0;
  var freq={}, i;
  for(i=0;i<s.length;i++){ var c=s[i]; freq[c]=(freq[c]||0)+1; }
  var H=0;
  for(var k in freq){ var p=freq[k]/s.length; H-=p*Math.log(p)/Math.LN2; }
  return H;
}
function levenshtein(a, b){
  var m=a.length, n=b.length;
  if(Math.abs(m-n) > 2) return 99;
  var dp=[], i, j;
  for(i=0;i<=m;i++) dp[i]=[i];
  for(j=0;j<=n;j++) dp[0][j]=j;
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      var cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}
function extractStrings(bytes, minLen){
  minLen = minLen || 5;
  var out=[], cur='';
  var max = Math.min(bytes.length, 2000000);
  for(var i=0;i<max;i++){
    var b=bytes[i];
    if(b>=32 && b<=126) cur+=String.fromCharCode(b);
    else { if(cur.length>=minLen) out.push(cur); cur=''; }
  }
  if(cur.length>=minLen) out.push(cur);
  return out;
}
function extractUrls(str){
  var re=/https?:\/\/[^\s"'<>)\]]+/gi, m=str.match(re)||[], out=[], seen={};
  for(var i=0;i<m.length;i++) if(!seen[m[i]]){ seen[m[i]]=true; out.push(m[i]); }
  return out;
}
function findSnippet(haystack, needle, windowSize){
  if(!haystack || !needle) return null;
  windowSize = windowSize || 40;
  var idx = haystack.toLowerCase().indexOf(String(needle).toLowerCase());
  if(idx < 0) return null;
  var start = Math.max(0, idx - Math.floor(windowSize/2));
  var end = Math.min(haystack.length, idx + needle.length + Math.floor(windowSize/2));
  return { before: haystack.slice(start, idx), match: haystack.slice(idx, idx + needle.length), after: haystack.slice(idx + needle.length, end) };
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function renderSnippet(sn){
  if(!sn) return '';
  return esc(sn.before) + '<mark>' + esc(sn.match) + '</mark>' + esc(sn.after);
}
function humanSize(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
}
function fmtDate(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }
function isTextLike(bytes){
  var n = Math.min(bytes.length, 512); if(!n) return false;
  var printable = 0;
  for(var i=0;i<n;i++){ var b=bytes[i]; if(b===0) return false; if((b>=32&&b<=126)||b===9||b===10||b===13) printable++; }
  return printable / n > 0.85;
}

/* ============================ PE PARSER ======================= */
function parsePE(bytes){
  if(bytes.length < 64) return null;
  if(bytes[0]!==0x4D || bytes[1]!==0x5A) return null;
  var peOffset = bytes[0x3C] | (bytes[0x3D]<<8) | (bytes[0x3E]<<16) | (bytes[0x3F]<<24);
  if(peOffset <= 0 || peOffset + 24 > bytes.length) return null;
  if(bytes[peOffset]!==0x50 || bytes[peOffset+1]!==0x45) return null;
  var machine = bytes[peOffset+4] | (bytes[peOffset+5]<<8);
  var numSections = bytes[peOffset+6] | (bytes[peOffset+7]<<8);
  var timestamp = (bytes[peOffset+8] | (bytes[peOffset+9]<<8) | (bytes[peOffset+10]<<16) | (bytes[peOffset+11]<<24)) >>> 0;
  var optHeaderSize = bytes[peOffset+20] | (bytes[peOffset+21]<<8);
  var optStart = peOffset + 24;
  if(optStart + 2 > bytes.length) return null;
  var magic = bytes[optStart] | (bytes[optStart+1]<<8);
  var pe32plus = (magic === 0x20B);
  var entryPoint = (bytes[optStart+16] | (bytes[optStart+17]<<8) | (bytes[optStart+18]<<16) | (bytes[optStart+19]<<24)) >>> 0;
  var sections = [];
  var sectStart = optStart + optHeaderSize;
  for(var i=0;i<numSections;i++){
    var off = sectStart + i*40;
    if(off + 40 > bytes.length) break;
    var name='';
    for(var j=0;j<8;j++){ if(bytes[off+j]===0) break; name+=String.fromCharCode(bytes[off+j]); }
    sections.push({
      name: name,
      virtualSize: (bytes[off+8] | (bytes[off+9]<<8) | (bytes[off+10]<<16) | (bytes[off+11]<<24))>>>0,
      virtualAddress: (bytes[off+12]| (bytes[off+13]<<8)| (bytes[off+14]<<16)| (bytes[off+15]<<24))>>>0,
      sizeOfRawData: (bytes[off+16]| (bytes[off+17]<<8)| (bytes[off+18]<<16)| (bytes[off+19]<<24))>>>0,
      pointerToRawData: (bytes[off+20]| (bytes[off+21]<<8)| (bytes[off+22]<<16)| (bytes[off+23]<<24))>>>0,
      characteristics: (bytes[off+36]| (bytes[off+37]<<8)| (bytes[off+38]<<16)| (bytes[off+39]<<24))>>>0
    });
  }
  return { machine:machine, numSections:numSections, timestamp:timestamp, pe32plus:pe32plus,
           entryPoint:entryPoint, sections:sections };
}

/* ==================== FILE ANALYSIS ========================= */
function mkFinding(sev, title, detail, pts, snippet){
  var f = { severity:sev, title:title, detail:detail, points:pts||0 };
  if(snippet) f.snippet = snippet;
  return f;
}

function analyzeFile(name, size, bytes, text){
  var findings=[], score=0;
  var ext = (name.split('.').pop() || '').toLowerCase();
  var nameLower = name.toLowerCase();

  // 1) Extension risk
  if(HIGH_RISK_EXT.indexOf(ext) >= 0){
    score += 15;
    findings.push(mkFinding('high',
      'Executable file type: .' + ext,
      '.' + ext + ' files contain machine code that runs directly on the host. This is the primary delivery format ' +
      'for malware, ransomware and remote-access trojans. Legitimate business documents almost never use this extension.',
      15, {before:'name: ', match:'.'+ext, after:''}));
  } else if(MED_RISK_EXT.indexOf(ext) >= 0){
    score += 8;
    findings.push(mkFinding('medium',
      'Macro-capable / archive file type: .' + ext,
      '.' + ext + ' files can carry executable macros, scripts, or nested archives. Office macro documents ' +
      '(docm/xlsm) are one of the most common initial-access vectors used by ransomware operators.',
      8, {before:'name: ', match:'.'+ext, after:''}));
  }

  // 2) Double extension trick
  if(/\.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|txt|mp3|mp4)\.(exe|scr|bat|cmd|vbs|ps1|js|jar|msi|hta|com|pif)$/i.test(name)){
    score += 40;
    findings.push(mkFinding('high',
      'Double-extension masquerade',
      'The filename ends in a legitimate-looking extension (' + (nameLower.match(/\.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|txt|mp3|mp4)/i)||[''])[0] + ') ' +
      'followed by an executable extension. Windows hides the real extension by default in Explorer, so the victim ' +
      'sees only the fake one. This is a classic malware distribution trick.',
      40, {before:'name: ', match:name, after:''}));
  }

  // 3) Right-to-left override
  if(/\u202E/.test(name)){
    score += 45;
    findings.push(mkFinding('high',
      'Right-to-left override character in filename',
      'The filename contains Unicode U+202E (RIGHT-TO-LEFT OVERRIDE). This reverses how the filename displays — ' +
      'e.g. "photo_\\u202Egnp.exe" is displayed as "photo_exe.png". Extremely strong malware indicator.',
      45, {before:'name: ', match:name, after:''}));
  }

  // 4) Magic byte mismatch
  var magic = detectMagic(bytes);
  if(magic && ext && magic.exts.indexOf(ext) < 0){
    score += 30;
    findings.push(mkFinding('high',
      'File type masquerading — signature mismatch',
      'The filename claims to be .' + ext + ', but the internal file signature matches "' + magic.type + '". ' +
      'Renaming a file to hide its true type is a classic technique used to bypass extension-based filters and ' +
      'to trick the user into opening an executable (e.g. "invoice.pdf.exe" or a PE binary renamed to .jpg).',
      30, {before:'detected bytes: ', match: magic.sig.map(function(b){ return ('0'+b.toString(16).toUpperCase()).slice(-2); }).join(' '), after:'  (expected for .'+ext+')'}));
  }

  // 5) PE analysis
  if(bytes.length > 64 && bytes[0]===0x4D && bytes[1]===0x5A){
    var peResult = analyzePE(bytes);
    for(var i=0;i<peResult.findings.length;i++){ findings.push(peResult.findings[i]); score += peResult.findings[i].points || 0; }
  }

  // 6) Image steg
  if(IMAGE_EXT.indexOf(ext) >= 0){
    var imgResult = analyzeImageSteg(bytes, ext);
    for(var k=0;k<imgResult.findings.length;k++){ findings.push(imgResult.findings[k]); score += imgResult.findings[k].points || 0; }
  }

  // 7) Text / strings
  if(text){
    var txtResult = analyzeTextContent(text, ext, false);
    for(var t=0;t<txtResult.findings.length;t++){ findings.push(txtResult.findings[t]); score += txtResult.findings[t].points || 0; }
  } else if(bytes.length > 100 && IMAGE_EXT.indexOf(ext) < 0 && !(bytes[0]===0x4D && bytes[1]===0x5A)){
    var strings = extractStrings(bytes, 6);
    var joined = strings.join('\n');
    var binResult = analyzeTextContent(joined, ext, true);
    for(var b=0;b<binResult.findings.length;b++){ findings.push(binResult.findings[b]); score += binResult.findings[b].points || 0; }
  }

  return { score: Math.min(score,100), findings:findings };
}

/* ---------------- PE deep analysis ---------------- */
function analyzePE(bytes){
  var findings=[], score=0;
  var pe = null;
  try { pe = parsePE(bytes); } catch(e){}
  if(!pe){
    findings.push(mkFinding('low', 'Malformed PE header',
      'File begins with an MZ signature but the PE header could not be parsed. May indicate a DOS-only executable, ' +
      'a corrupted file, or a deliberately malformed header used to confuse parsers.', 5));
    return { findings:findings, score:5 };
  }

  var strings = extractStrings(bytes, 5);
  var joined = strings.join('\n');
  var lower = joined.toLowerCase();

  // Timestamp
  if(pe.timestamp > 0){
    var compiled = new Date(pe.timestamp * 1000);
    var ageDays = (Date.now() - compiled.getTime()) / 86400000;
    if(ageDays < 30 && ageDays > 0){
      score += 8;
      findings.push(mkFinding('medium', 'Recently compiled binary',
        'The PE header reports a compile timestamp of ' + compiled.toISOString().slice(0,10) + ' — only ' +
        Math.round(ageDays) + ' days old. Freshly compiled binaries are typical of newly generated malware samples ' +
        'built for a specific campaign.', 8));
    }
    if(compiled.getTime() > Date.now() || compiled.getFullYear() < 1995){
      score += 10;
      findings.push(mkFinding('medium', 'Anomalous compile timestamp',
        'The compile timestamp decodes to ' + compiled.toISOString() + ', which is outside a plausible range. ' +
        'Manipulating the timestamp ("timestomping") is an anti-forensic technique used by malware.', 10));
    }
  }

  // Sections
  var highEntropy = [], packerSection = null;
  var packerNames = ['upx0','upx1','upx2','.aspack','.adata','.petite','.mpress1','.mpress2',
                     '.themida','.vmp0','.vmp1','.enigma1','.enigma2','.packed','.pec1','.pec2'];
  for(var s=0;s<pe.sections.length;s++){
    var sect = pe.sections[s];
    if(sect.sizeOfRawData === 0) continue;
    var end = Math.min(sect.pointerToRawData + sect.sizeOfRawData, bytes.length);
    var data = bytes.slice(sect.pointerToRawData, end);
    if(data.length >= 256){
      var ent = entropy(data);
      if(ent > 7.4 && sect.name !== '.rsrc' && sect.name !== '.reloc'){
        highEntropy.push({ name:sect.name, entropy:ent, size:sect.sizeOfRawData });
      }
    }
    var lname = sect.name.toLowerCase().replace(/\s+/g,'');
    if(packerNames.indexOf(lname) >= 0 && !packerSection) packerSection = sect.name;
  }

  if(packerSection){
    score += 25;
    findings.push(mkFinding('high', 'Known packer/protector section: "' + packerSection + '"',
      'A section named "' + packerSection + '" matches a known executable packer or protector (UPX, ASPack, ' +
      'Themida, VMProtect, Enigma, PECompact). Packers compress or encrypt the real code inside the file, hiding ' +
      'it from signature-based antivirus. Legitimate software uses them occasionally, but the overwhelming ' +
      'majority of packed binaries submitted for forensic analysis turn out to be malicious.',
      25, {before:'section name: ', match: packerSection, after:'  (matches known packer)'}));
  }
  if(highEntropy.length > 0){
    var top = highEntropy[0];
    score += 20;
    findings.push(mkFinding('high', 'High-entropy section: "' + top.name + '" (' + top.entropy.toFixed(2) + '/8.0)',
      'Section "' + top.name + '" has a Shannon entropy of ' + top.entropy.toFixed(2) + ' bits/byte, very close to ' +
      'the theoretical maximum of 8 (indicating essentially random bytes). Normal compiled code has entropy around ' +
      '6.5. Entropy this high is a strong indicator that this section contains packed code, encrypted shellcode, ' +
      'or an embedded payload that will be unpacked at runtime.',
      20, {before:'section: ', match: top.name + '  entropy=' + top.entropy.toFixed(2), after:'  size=' + top.size + ' bytes'}));
  }

  // Process-injection chain
  var hasWriteMemory = joined.indexOf('WriteProcessMemory') >= 0;
  var hasRemoteThread = joined.indexOf('CreateRemoteThread') >= 0 || joined.indexOf('NtCreateThreadEx') >= 0;
  var hasVirtualAllocEx = joined.indexOf('VirtualAllocEx') >= 0 || joined.indexOf('NtAllocateVirtualMemory') >= 0;
  var hasOpenProcess = joined.indexOf('OpenProcess') >= 0;
  if((hasWriteMemory && hasRemoteThread) || (hasVirtualAllocEx && hasWriteMemory)){
    score += 40;
    var chain = [];
    if(hasOpenProcess) chain.push('OpenProcess');
    if(hasVirtualAllocEx) chain.push('VirtualAllocEx');
    if(hasWriteMemory) chain.push('WriteProcessMemory');
    if(hasRemoteThread) chain.push('CreateRemoteThread');
    findings.push(mkFinding('high', 'Process-injection API chain detected',
      'The binary imports the classic process-injection API chain: ' + chain.join(' \u2192 ') + '. ' +
      'This sequence lets the program allocate memory inside another running process, write attacker-supplied code ' +
      'into it, and execute that code inside the host process. It is the single most common technique used by ' +
      'malware to hide from endpoint protection, escalate into privileged processes, and inject payloads into ' +
      'browsers or system services (used by Cobalt Strike, Meterpreter, and virtually every RAT).',
      40, {before:'imported APIs: ', match: chain.join(' \u2192 '), after:''}));
  }

  // Download-and-execute
  var hasUrlDownload = joined.indexOf('URLDownloadToFile') >= 0 || joined.indexOf('URLDownloadToCacheFile') >= 0 ||
                       (joined.indexOf('InternetOpen') >= 0 && joined.indexOf('InternetReadFile') >= 0) ||
                       (joined.indexOf('WinHttpOpen') >= 0 && joined.indexOf('WinHttpReadData') >= 0);
  var hasExecute = joined.indexOf('WinExec') >= 0 || joined.indexOf('ShellExecute') >= 0 || joined.indexOf('CreateProcess') >= 0;
  if(hasUrlDownload && hasExecute){
    score += 35;
    findings.push(mkFinding('high', 'Download-and-execute behaviour (dropper pattern)',
      'Imports a network download API alongside a process-launch API. This combination is the signature of a ' +
      '"dropper" or "downloader" — a small first-stage binary whose only job is to fetch a second-stage payload ' +
      'from the internet and run it immediately. This is exactly how Emotet, TrickBot, SmokeLoader, QakBot, and ' +
      'most banking trojans begin their infection chain.',
      35, {before:'API combination: ', match: (joined.indexOf('URLDownloadToFile')>=0?'URLDownloadToFile':'InternetReadFile/WinHttpReadData') + ' + ' + (joined.indexOf('WinExec')>=0?'WinExec':joined.indexOf('ShellExecute')>=0?'ShellExecute':'CreateProcess'), after:''}));
  } else if(hasUrlDownload){
    score += 15;
    findings.push(mkFinding('medium', 'Network download API present',
      'Imports an API capable of retrieving files from remote servers (URLDownloadToFile / InternetReadFile / ' +
      'WinHttpReadData). The binary can fetch additional payloads at runtime.', 15));
  }

  // Anti-debug
  var antiDebugApis = ['IsDebuggerPresent','CheckRemoteDebuggerPresent','NtQueryInformationProcess','OutputDebugString','QueryPerformanceCounter'];
  var antiDebugHits = [];
  for(var ad=0;ad<antiDebugApis.length;ad++) if(joined.indexOf(antiDebugApis[ad]) >= 0) antiDebugHits.push(antiDebugApis[ad]);
  if(antiDebugHits.length >= 2){
    score += 15;
    findings.push(mkFinding('medium', 'Anti-debugging techniques imported',
      'Imports ' + antiDebugHits.join(', ') + '. These APIs detect when the binary is being analysed under a ' +
      'debugger and change behaviour accordingly — a standard evasion technique used to hide malicious activity ' +
      'during sandbox or analyst review.',
      15, {before:'anti-debug APIs: ', match: antiDebugHits.join(', '), after:''}));
  }

  // Persistence
  if(joined.indexOf('RegSetValue') >= 0 || joined.indexOf('RegCreateKey') >= 0 || joined.indexOf('RegSetValueEx') >= 0 || joined.indexOf('RegCreateKeyEx') >= 0){
    if(lower.indexOf('currentversion\\run') >= 0 || lower.indexOf('currentversion\\\\run') >= 0){
      score += 25;
      findings.push(mkFinding('high', 'Registry auto-start persistence',
        'References the Windows "Run" registry key (HKCU/HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run). ' +
        'Writing to this key makes the program launch automatically at every user login. This is the single most ' +
        'common persistence mechanism used by consumer malware.',
        25, {before:'registry path: ', match:'CurrentVersion\\Run', after:''}));
    }
  }
  if(joined.indexOf('CreateService') >= 0 || joined.indexOf('OpenSCManager') >= 0){
    score += 20;
    findings.push(mkFinding('high', 'Windows service persistence API',
      'Imports service-control APIs (CreateService / OpenSCManager). Installing a Windows service is a persistence ' +
      'technique used by rootkits and ransomware to survive reboots and run with SYSTEM privileges.', 20));
  }
  if(joined.indexOf('AdjustTokenPrivileges') >= 0 || joined.indexOf('LookupPrivilegeValue') >= 0 || joined.indexOf('OpenProcessToken') >= 0){
    score += 15;
    findings.push(mkFinding('medium', 'Privilege-elevation APIs imported',
      'Uses token-manipulation APIs to enable or acquire elevated privileges (e.g. SeDebugPrivilege, ' +
      'SeShutdownPrivilege). Legitimate consumer applications rarely need this capability.', 15));
  }
  if(joined.indexOf('CryptEncrypt') >= 0){
    score += 20;
    findings.push(mkFinding('high', 'File-encryption API imported (CryptEncrypt)',
      'Imports CryptEncrypt, used by ransomware to encrypt files on the victim\'s machine. Combined with other ' +
      'indicators this strongly suggests a ransomware payload.', 20));
  }
  if(joined.indexOf('GetAsyncKeyState') >= 0 || joined.indexOf('SetWindowsHookEx') >= 0){
    score += 25;
    findings.push(mkFinding('high', 'Keylogging APIs imported',
      'Imports ' + (joined.indexOf('GetAsyncKeyState')>=0?'GetAsyncKeyState':'SetWindowsHookEx') +
      ' — used to capture keystrokes for credential theft. This is a hallmark of keyloggers and info-stealers ' +
      '(AgentTesla, HawkEye, LokiBot, Raccoon, Vidar, FormBook).',
      25, {before:'keylogging API: ', match:(joined.indexOf('GetAsyncKeyState')>=0?'GetAsyncKeyState':'SetWindowsHookEx'), after:''}));
  }

  // Family
  for(var mf=0; mf<INTEL.malwareFamilies.length; mf++){
    var fam = INTEL.malwareFamilies[mf];
    var sn = findSnippet(joined, fam, 60);
    if(sn){
      score += 40;
      findings.push(mkFinding('high', 'Known malware family indicator: "' + fam + '"',
        'The string "' + fam + '" appears inside the binary. This is a name, mutex, campaign tag, or user-agent ' +
        'associated with a known malware family. Manual verification with a sandbox is strongly recommended.',
        40, sn));
      break;
    }
  }

  // Commands
  var cmdHits = 0;
  for(var sc=0; sc<INTEL.suspiciousCommands.length; sc++){
    var cmdSn = findSnippet(joined, INTEL.suspiciousCommands[sc][0], 60);
    if(cmdSn){
      cmdHits++;
      if(cmdHits <= 4){
        score += 12;
        findings.push(mkFinding('high', 'Suspicious command reference: "' + INTEL.suspiciousCommands[sc][0] + '"',
          INTEL.suspiciousCommands[sc][1], 12, cmdSn));
      }
    }
  }

  // URLs
  var urls = extractUrls(joined);
  for(var u=0; u<urls.length; u++){
    var r = analyzeUrl(urls[u]);
    if(r.score >= 35){
      score += 20;
      findings.push(mkFinding('high', 'Malicious URL embedded in binary',
        'The URL "' + urls[u] + '" scored ' + r.score + '/100 on URL analysis (' + r.verdict + '). Hard-coded URLs ' +
        'inside an executable are typical of malware C2 infrastructure and downloaders.',
        20, {before:'embedded URL: ', match: urls[u], after:''}));
      break;
    }
  }
  var ipMatches = joined.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g) || [];
  var publicIps = [];
  for(var ip=0; ip<ipMatches.length; ip++){
    var p = ipMatches[ip].split('.').map(Number);
    if(p[0]===10 || p[0]===127 || (p[0]===192&&p[1]===168) || (p[0]===172&&p[1]>=16&&p[1]<=31)) continue;
    if(publicIps.indexOf(ipMatches[ip]) < 0) publicIps.push(ipMatches[ip]);
  }
  if(publicIps.length > 0){
    score += 15;
    findings.push(mkFinding('medium', 'Hard-coded public IP address' + (publicIps.length>1?'es':''),
      'The binary contains ' + publicIps.length + ' public IP address(es): ' + publicIps.slice(0,3).join(', ') + '. ' +
      'Hard-coded IPs are a common way malware identifies C2 servers without relying on DNS, which is often blocked ' +
      'or monitored.',
      15, {before:'public IP: ', match: publicIps.slice(0,3).join(', '), after:''}));
  }

  return { findings:findings, score:Math.min(score,100) };
}

/* ---------------- Image steg ---------------- */
function analyzeImageSteg(bytes, ext){
  var findings=[], score=0;
  if(ext === 'jpg' || ext === 'jpeg'){
    if(bytes[0]!==0xFF || bytes[1]!==0xD8){
      findings.push(mkFinding('low', 'Invalid JPEG header',
        'The file does not begin with the standard JPEG Start-Of-Image marker (FFD8).', 5));
      score += 5;
    }
    var soiCount = 0;
    for(var i=0;i<bytes.length-1;i++) if(bytes[i]===0xFF && bytes[i+1]===0xD8) soiCount++;
    if(soiCount > 1){
      findings.push(mkFinding('high', 'Multiple JPEG start markers (' + soiCount + ')',
        'A normal JPEG contains exactly one Start-Of-Image (FFD8) marker. Finding ' + soiCount + ' suggests one or ' +
        'more images (or payloads) have been embedded inside this file — a classic steganographic technique used ' +
        'by tools like steghide, outguess, and F5.',
        25, {before:'SOI marker (FFD8) count: ', match: soiCount + ' occurrences', after:''}));
      score += 25;
    }
    for(var j=bytes.length-2;j>0;j--){
      if(bytes[j]===0xFF && bytes[j+1]===0xD9){
        var trailing = bytes.length - (j+2);
        if(trailing > 32){
          findings.push(mkFinding('high', 'Data appended after JPEG EOI marker',
            trailing + ' bytes of data found after the JPEG end-of-image (FFD9) marker. Standard JPEG decoders ' +
            'ignore everything after FFD9, which makes this the single most common way to hide files inside images. ' +
            'Tools like steghide, outguess, and "copy /b image.jpg+payload.zip image.jpg" produce exactly this pattern.',
            35, {before:'EOI at offset ' + j + ', ', match: trailing + ' bytes of trailing data', after:''}));
          score += 35;
        } else if(trailing > 0){
          findings.push(mkFinding('low', 'Minor trailing data after EOI',
            trailing + ' bytes of data after the JPEG end marker — usually an embedded thumbnail or EXIF remnant.', 3));
          score += 3;
        }
        break;
      }
    }
  }

  if(ext === 'png'){
    var sig = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];
    var sigOk = true;
    for(var s=0;s<8;s++) if(bytes[s]!==sig[s]){ sigOk=false; break; }
    if(!sigOk){
      findings.push(mkFinding('medium', 'Invalid PNG signature',
        'File does not begin with the standard 8-byte PNG signature.', 10));
      score += 10;
    }
    var offset = 8, chunks = [];
    while(offset + 12 < bytes.length){
      var len = (bytes[offset]<<24)|(bytes[offset+1]<<16)|(bytes[offset+2]<<8)|bytes[offset+3];
      if(len < 0 || offset + 12 + len > bytes.length) break;
      var ctype = String.fromCharCode(bytes[offset+4],bytes[offset+5],bytes[offset+6],bytes[offset+7]);
      chunks.push({ type:ctype, length:len, offset:offset });
      offset += 12 + len;
      if(ctype === 'IEND') break;
    }
    if(offset < bytes.length - 4){
      var pngTrail = bytes.length - offset;
      if(pngTrail > 32){
        findings.push(mkFinding('high', 'Data appended after PNG IEND chunk',
          pngTrail + ' bytes of data after the PNG IEND (end-of-image) chunk. PNG decoders stop reading at IEND, ' +
          'so this is a preferred hiding place for steganographic payloads and appended files.',
          35, {before:'IEND at offset ' + offset + ', ', match: pngTrail + ' bytes of trailing data', after:''}));
        score += 35;
      }
    }
    var knownChunks = ['IHDR','PLTE','IDAT','IEND','tRNS','gAMA','cHRM','sRGB','iCCP','tEXt','zTXt','iTXt','bKGD','pHYs','sBIT','hIST','tIME','eXIf','sPLT'];
    for(var c=0;c<chunks.length;c++){
      if(knownChunks.indexOf(chunks[c].type) < 0 && chunks[c].type[2] === chunks[c].type[2].toLowerCase()){
        findings.push(mkFinding('medium', 'Non-standard PNG chunk "' + chunks[c].type + '"',
          'The PNG contains a private/ancillary chunk ("' + chunks[c].type + '", ' + chunks[c].length + ' bytes) ' +
          'that is not part of the standard PNG specification. Private chunks are a common carrier for hidden data ' +
          'in steganographic tools.',
          15, {before:'chunk: ', match: chunks[c].type, after:'  (' + chunks[c].length + ' bytes)'}));
        score += 15;
      }
    }
  }

  var embeddedSigs = [
    {type:'MZ',  bytes:[0x4D,0x5A],          severity:'high',   score:35, label:'Windows PE executable (MZ)'},
    {type:'ZIP', bytes:[0x50,0x4B,0x03,0x04], severity:'high',   score:25, label:'ZIP archive'},
    {type:'PDF', bytes:[0x25,0x50,0x44,0x46], severity:'medium', score:15, label:'PDF document'},
    {type:'ELF', bytes:[0x7F,0x45,0x4C,0x46], severity:'high',   score:30, label:'Linux ELF binary'}
  ];
  var found = {}, maxScan = Math.min(bytes.length - 8, 2000000);
  for(var si=0; si<embeddedSigs.length; si++){
    var sigDef = embeddedSigs[si];
    for(var p=1; p<maxScan; p++){
      var match = true;
      for(var q=0;q<sigDef.bytes.length;q++) if(bytes[p+q]!==sigDef.bytes[q]){ match=false; break; }
      if(match){
        findings.push(mkFinding(sigDef.severity, 'Embedded ' + sigDef.label + ' detected',
          'A ' + sigDef.label + ' signature was found at byte offset ' + p + ' inside the image — not at the start ' +
          'of the file. This is a direct indication that an additional file (very likely malicious) has been ' +
          'appended to or hidden within the image.',
          sigDef.score, {before:'offset ' + p + ': ', match: sigDef.bytes.map(function(b){ return ('0'+b.toString(16).toUpperCase()).slice(-2); }).join(' '), after:'  (' + sigDef.label + ')'}));
        score += sigDef.score;
        found[sigDef.type] = true;
        break;
      }
    }
  }

  var startByte = Math.floor(bytes.length * 0.1);
  var endByte = Math.floor(bytes.length * 0.5);
  if(endByte - startByte > 4096){
    var ones = 0, total = 0;
    var step = Math.max(1, Math.floor((endByte - startByte) / 65536));
    for(var b=startByte; b<endByte; b+=step){ ones += bytes[b] & 1; total++; }
    var ratio = ones / total;
    if(ratio < 0.35 || ratio > 0.65){
      findings.push(mkFinding('medium', 'LSB distribution anomaly',
        'The least-significant bits in the image data are skewed (ratio = ' + (ratio*100).toFixed(1) + '%; natural ' +
        'images average ~50%). This pattern indicates the LSBs have been overwritten with embedded data — the ' +
        'classic signature of LSB-replacement steganography.',
        20, {before:'LSB ones ratio: ', match:(ratio*100).toFixed(1) + '%', after:'  (natural ~50%)'}));
      score += 20;
    }
  }
  return { score: Math.min(score,100), findings:findings };
}

/* ---------------- Text content ---------------- */
function analyzeTextContent(text, ext, isBinary){
  var findings=[], score=0;
  var lower = text.toLowerCase();

  // Encoded PowerShell
  var psMatch = text.match(/powershell\s+-e(nc|ncodedcommand)?\s+[A-Za-z0-9+\/=]{40,}/i);
  if(psMatch){
    score += 30;
    findings.push(mkFinding('high', 'Encoded PowerShell command',
      'Contains a base64-encoded PowerShell command (powershell -enc ...). This is the most common way to hide ' +
      'malicious scripts from casual inspection. Decoded, these commands routinely download and execute additional ' +
      'payloads, disable antivirus, and establish persistence.',
      30, {before:'', match: psMatch[0].slice(0,80) + (psMatch[0].length > 80 ? '...' : ''), after:''}));
  }

  // Base64 blob
  var b64Match = text.match(/[A-Za-z0-9+\/]{200,}={0,2}/);
  if(b64Match){
    score += 15;
    findings.push(mkFinding('medium', 'Large base64-encoded blob',
      'A base64 block of 200+ characters was found. Malware droppers frequently embed their next stage as base64 ' +
      'to hide it from text-based scanners and casual review.',
      15, {before:'', match: b64Match[0].slice(0,80) + '...', after:''}));
  }

  // Commands
  var hits = 0;
  for(var i=0;i<INTEL.suspiciousCommands.length;i++){
    var sn = findSnippet(text, INTEL.suspiciousCommands[i][0], 60);
    if(sn){
      hits++;
      if(hits <= 4){
        score += 15;
        findings.push(mkFinding('high', 'Suspicious command: "' + INTEL.suspiciousCommands[i][0] + '"',
          INTEL.suspiciousCommands[i][1], 15, sn));
      }
    }
  }

  // Keywords
  for(var k=0;k<INTEL.maliciousFileKeywords.length;k++){
    var kw = INTEL.maliciousFileKeywords[k];
    var kwSn = findSnippet(text, kw, 60);
    if(kwSn){
      score += 20;
      findings.push(mkFinding('high', 'Known malware indicator: "' + kw + '"',
        'Contains the string "' + kw + '" — a well-known tool, command, or code fragment associated with malware ' +
        'and offensive tooling.', 20, kwSn));
    }
  }

  // Registry
  if(/HKEY_(LOCAL_MACHINE|CURRENT_USER|CLASSES_ROOT)/i.test(text) || /\bHKLM\b|\bHKCU\b/.test(text)){
    if(/CurrentVersion[\\\/]+Run/i.test(text)){
      score += 20;
      findings.push(mkFinding('high', 'Registry auto-start path referenced',
        'References the Windows Run/RunOnce registry key, which launches programs automatically at user login. ' +
        'This is the standard persistence mechanism for malware that must survive reboot.',
        20, {before:'', match:'CurrentVersion\\Run', after:''}));
    } else {
      score += 8;
      findings.push(mkFinding('medium', 'Windows registry paths referenced',
        'References registry keys. Combined with autorun paths this is a persistence indicator.', 8));
    }
  }

  // URLs
  var urls = extractUrls(text);
  for(var u=0;u<urls.length;u++){
    var r = analyzeUrl(urls[u]);
    if(r.score >= 35){
      score += 20;
      findings.push(mkFinding('high', 'Malicious URL embedded: ' + urls[u],
        'The embedded URL scored ' + r.score + '/100 on URL analysis — verdict: ' + r.verdict + '. Hard-coded URLs ' +
        'pointing to known-malicious or clearly-suspicious infrastructure are typical of downloaders and C2 beacon code.',
        20, {before:'URL: ', match: urls[u], after:''}));
    } else if(r.score >= 15){
      score += 8;
      findings.push(mkFinding('medium', 'Suspicious URL embedded: ' + urls[u],
        'The embedded URL scored ' + r.score + '/100 — verdict: ' + r.verdict + '.', 8,
        {before:'URL: ', match: urls[u], after:''}));
    }
  }

  // Public IPs
  var ipMatches = text.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g) || [];
  var publicIps = [];
  for(var ip=0; ip<ipMatches.length; ip++){
    var p = ipMatches[ip].split('.').map(Number);
    if(p[0]===10 || p[0]===127 || (p[0]===192&&p[1]===168) || (p[0]===172&&p[1]>=16&&p[1]<=31)) continue;
    if(publicIps.indexOf(ipMatches[ip]) < 0) publicIps.push(ipMatches[ip]);
  }
  if(publicIps.length > 0 && !isBinary){
    score += 10;
    findings.push(mkFinding('medium', 'Hard-coded public IP address' + (publicIps.length>1?'es':''),
      'Contains ' + publicIps.length + ' public IP address(es): ' + publicIps.slice(0,3).join(', ') + '. Malware ' +
      'frequently hard-codes C2 IPs; legitimate documents rarely contain them.',
      10, {before:'public IP: ', match: publicIps.slice(0,3).join(', '), after:''}));
  }

  return { findings:findings, score:Math.min(score,100) };
}

/* ==================== URL ANALYSIS ========================== */
/* Bundled indicators are demonstration data; this prototype does not query a live reputation feed. */
function isIPv4Host(host){
  if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) return false;
  return host.split('.').every(function(part){return Number(part)>=0 && Number(part)<=255;});
}
function domainMatches(host,domain){
  host=String(host||'').toLowerCase().replace(/\.$/,'');
  domain=String(domain||'').toLowerCase().replace(/^\.+|\.+$/g,'');
  return !!domain && (host===domain || host.slice(-(domain.length+1))==='.'+domain);
}
function analyzeUrl(url){
  var findings=[], score=0;
  var out = { url:url, syntax:'', reputation:'', blacklist:'', domain:'', threatIntel:'', verdict:'', score:0, findings:[] };

  var parsed;
  try { parsed = new URL(url); out.syntax = 'Valid'; }
  catch(e){
    out.syntax='Invalid'; out.verdict='Invalid URL'; out.score=10; out.findings=findings;
    findings.push(mkFinding('low', 'Malformed URL', 'URL does not parse as a valid URI (RFC 3986).', 10));
    return out;
  }

  var host = parsed.hostname.toLowerCase();
  var parts = host.split('.');
  var sld = parts.length >= 2 ? parts[parts.length-2] : parts[0];
  var tld = '.' + (parts[parts.length-1] || '');
  var path = parsed.pathname;
  var pathLower = path.toLowerCase();
  var fullPathLower = (parsed.pathname + parsed.search).toLowerCase();

  /* ---- 4.2.1 Syntax checks ---- */
  if(isIPv4Host(host)){
    score+=10;
    findings.push(mkFinding('low','IP address used as hostname',
      'The URL uses a numeric IPv4 host. This can be legitimate in testing or internal services; on its own it is not evidence of malware.',
      10,{before:'host: ',match:host,after:' (not threat confirmation)'}));
  }
  if(parsed.port && ['80','443','8080','8443'].indexOf(parsed.port) < 0){
    score += 20;
    findings.push(mkFinding('high', 'Non-standard port :' + parsed.port,
      'Port ' + parsed.port + ' is not typically used for web traffic. Attackers frequently host C2 servers and ' +
      'malware distribution endpoints on unusual ports to evade network monitoring and firewall rules.',
      20, {before:'', match:':' + parsed.port, after:'  (unusual port)'}));
  }
  if(url.indexOf('@') >= 0 && url.split('://')[1].split(/[\/?#]/)[0].indexOf('@') >= 0){
    score += 40;
    findings.push(mkFinding('high', '"@" used to obscure true host',
      'The URL contains "@" in the authority section. In HTTP, everything before "@" is treated as a username and ' +
      'everything after is the real host — so "http://trusted.com@evil.tk/" actually connects to evil.tk. This is ' +
      'a classic phishing trick used to make the URL appear to point at a trusted site.',
      40, {before:'', match:'@', after:''}));
  }
  if(/^https?:\/\/(0x[0-9a-f]+|0[0-7]+\.[0-7]+\.[0-7]+\.[0-7]+|\d{8,})/i.test(url)){
    score += 35;
    findings.push(mkFinding('high', 'Obfuscated IP encoding',
      'The host uses hex, octal, or decimal-only encoding to disguise the IP address. Legitimate sites never do ' +
      'this — it is used specifically to evade URL filters that match dotted-decimal IPs.',
      35, {before:'host: ', match: host, after:''}));
  }

  /* ---- Subdomains ---- */
  var subs = Math.max(0, parts.length - 2);
  if(subs >= 5){
    score += 30;
    findings.push(mkFinding('high', 'Excessive subdomain nesting (' + subs + ' levels)',
      'The hostname contains ' + subs + ' subdomain levels. Deeply nested subdomains are used to (a) bury the real ' +
      'registrable domain at the far right of the URL where users rarely look, (b) evade URL-length detection rules, ' +
      'and (c) mimic legitimate multi-service sites — e.g. "secure.login.verify.actual-bank.tk".',
      30, {before:'host: ', match: host, after:'  (' + subs + ' subdomains)'}));
  } else if(subs >= 3){
    score += 12;
    findings.push(mkFinding('medium', 'Elevated subdomain depth',
      'The URL uses ' + subs + ' subdomain levels. This is typical of phishing URLs that impersonate multi-tenant ' +
      'legitimate services.', 12));
  }

  /* ---- URL length ---- */
  if(url.length > 200){
    score += 15;
    findings.push(mkFinding('medium', 'Very long URL (' + url.length + ' characters)',
      'URLs over 200 characters are frequently used to obscure the real destination, pad detection signatures, or ' +
      'hide payload parameters deep in the query string.', 15));
  } else if(url.length > 100){
    score += 5;
    findings.push(mkFinding('low', 'Long URL (' + url.length + ' characters)',
      'Long URLs can be an obfuscation technique.', 5));
  }

  /* ---- Encoding ---- */
  var encodedCount = (url.match(/%[0-9a-fA-F]{2}/g) || []).length;
  if(encodedCount > 5){
    score += 15;
    findings.push(mkFinding('medium', 'Heavy URL encoding (' + encodedCount + ' encoded chars)',
      'Excessive percent-encoding is used to hide malicious strings from signature-based detection and to bypass ' +
      'simple filters.', 15));
  }
  if(/[a-f0-9]{32,}/i.test(url)){
    score += 15;
    findings.push(mkFinding('medium', 'Long hexadecimal string in URL',
      'The URL contains a hex string of 32+ characters — typical of tracking identifiers, hashes of malicious ' +
      'payloads, or obfuscated shellcode identifiers used by droppers.', 15));
  }
  if(/[A-Za-z0-9+\/]{40,}={0,2}/.test(parsed.search)){
    score += 15;
    findings.push(mkFinding('medium', 'Base64-like query parameter',
      'The query string contains a base64-encoded value. Attackers use base64 to hide URLs, commands, or binary ' +
      'data inside parameters that would otherwise be filtered by regex rules.', 15));
  }

  /* ---- Reputation ---- */
  if(INTEL.suspiciousTLDs.indexOf(tld) >= 0){
    score+=5;
    findings.push(mkFinding('low','TLD with elevated abuse reports: "'+tld+'"',
      'The TLD can warrant review but does not establish whether this particular domain is malicious.',
      5,{before:'TLD: ',match:tld,after:' (weak heuristic only)'}));
  }
  if(INTEL.shorteners.indexOf(host) >= 0){
    score+=5;
    findings.push(mkFinding('low','URL shortener detected',
      host+' obscures the destination; the redirect was not resolved, so this is a review cue rather than a malicious verdict.',
      5,{before:'host: ',match:host,after:' (destination not resolved)'}));
  }

  /* ---- DGA ---- */
  var ent = stringEntropy(sld);
  if(ent > 3.5 && sld.length > 8){
    score += 30;
    findings.push(mkFinding('high', 'Domain appears algorithmically generated (DGA)',
      'The second-level domain "' + sld + '" has an entropy of ' + ent.toFixed(2) + ' bits/char, indicating a ' +
      'random character distribution. DGA (Domain Generation Algorithm) malware uses such names to rotate ' +
      'command-and-control infrastructure daily and defeat static blocklists.',
      30, {before:'SLD: ', match: sld, after:'  entropy=' + ent.toFixed(2)}));
  }
  if(sld.length > 20){
    score += 10;
    findings.push(mkFinding('low', 'Unusually long domain name (' + sld.length + ' chars)',
      'Long, random-looking domain names are commonly used by malware and spam infrastructure.', 10));
  }
  var digits = (sld.match(/\d/g) || []).length;
  if(sld.length > 5 && digits / sld.length > 0.3){
    score += 15;
    findings.push(mkFinding('medium', 'High digit ratio in domain',
      Math.round(digits/sld.length*100) + '% of the domain name is digits — a pattern typical of bulk-registered ' +
      'malicious domains that are mass-generated.', 15,
      {before:'SLD: ', match: sld, after:'  (' + Math.round(digits/sld.length*100) + '% digits)'}));
  }
  var hyphens = (sld.match(/-/g) || []).length;
  if(hyphens >= 3){
    score += 15;
    findings.push(mkFinding('medium', 'Multiple hyphens in domain (' + hyphens + ')',
      'Domains with many hyphens are frequently used to mimic legitimate brands — e.g. ' +
      '"secure-login-account-verify.tk".', 15,
      {before:'SLD: ', match: sld, after:'  (' + hyphens + ' hyphens)'}));
  }
  if(sld.indexOf('xn--') === 0 || host.indexOf('xn--') >= 0){
    score += 50;
    findings.push(mkFinding('high', 'Punycode / IDN homograph domain',
      'The domain contains an internationalized (punycode) label. Attackers use visually identical Unicode ' +
      'characters to make a domain look like a legitimate site (e.g. "\u0430\u0440\u0440\u04cf\u0435.com" looks like ' +
      '"apple.com"). This is a very strong phishing indicator.',
      50, {before:'host: ', match: host, after:''}));
  }

  /* ---- Brand ---- */
  for(var b=0; b<INTEL.brandNames.length; b++){
    var brand = INTEL.brandNames[b];
    if(sld === brand) continue;
    var dist = levenshtein(sld, brand);
    if(dist === 1 && Math.abs(sld.length - brand.length) <= 1 && sld.length >= 4){
      score += 50;
      findings.push(mkFinding('high', 'Possible typosquatting of "' + brand + '"',
        'The domain "' + sld + '" differs from the well-known brand "' + brand + '" by exactly 1 character ' +
        '(Levenshtein distance = 1). This is a classic phishing technique — e.g. "paypa1.com", "g00gle.com", ' +
        '"micosoft.com".',
        50, {before:'SLD: ', match: sld, after:'  vs brand "' + brand + '" (distance=1)'}));
      break;
    }
    var brandInLabel=parts.some(function(label){return label===brand || label.indexOf(brand)>=0;});
    if(brandInLabel && sld!==brand && !domainMatches(host,brand+tld)){
      score+=10;
      findings.push(mkFinding('low','Brand-like hostname component: "'+brand+'"',
        'A hostname label contains a brand string, but that alone does not establish impersonation. Check the registrable domain and independent reputation evidence.',
        10,{before:'host: ',match:host,after:' (heuristic only)'}));
      break;
    }
  }

  /* ---- Potentially misleading domain structure ---- */
  var otherTlds=['.com','.net','.org','.gov','.edu'];
  for(var o=0;o<otherTlds.length;o++){
    var ot=otherTlds[o];
    // Require a full intermediary label such as ".com.evil", not the ".co" prefix inside ".com".
    if(host.indexOf(ot+'.')>=0 && tld!==ot){
      score+=15;
      findings.push(mkFinding('medium','Potentially misleading domain structure',
        'The hostname contains "'+ot+'" before the final suffix. Check from right to left; this heuristic is not a threat confirmation.',
        15,{before:'host: ',match:host,after:' (derived suffix: "'+sld+tld+'")'}));
      break;
    }
  }

  /* ---- Path checks ---- */
  if(/\.(exe|dll|scr|msi|bat|cmd|ps1|vbs|jar|apk|bin|com|pif|hta)(\?|$)/i.test(path)){
    score += 30;
    findings.push(mkFinding('high', 'URL points to an executable download',
      'The URL path ends in an executable extension. Drive-by download URLs frequently end in .exe, .scr, .msi, ' +
      'or script files that launch immediately when clicked.',
      30, {before:'path: ', match: path, after:''}));
  }
  var sensitivePaths = ['/wp-admin','/phpmyadmin','/.env','/config.php','/backup','/admin/config','/shell','/cmd.php','/upload.php','/xmlrpc.php','/cgi-bin/'];
  for(var sp=0; sp<sensitivePaths.length; sp++){
    if(pathLower.indexOf(sensitivePaths[sp]) >= 0){
      score += 20;
      findings.push(mkFinding('medium', 'Sensitive server path: "' + sensitivePaths[sp] + '"',
        'The URL targets a sensitive administration, configuration, or exploit-related path. This is characteristic ' +
        'of automated vulnerability scanners and attempts to access compromised administration panels or legacy ' +
        'XML-RPC endpoints abused for brute-force amplification.',
        20, {before:'path: ', match: path, after:''}));
      break;
    }
  }
  var phishingHits = [];
  for(var pk=0; pk<INTEL.urlPhishingKeywords.length; pk++){
    if(fullPathLower.indexOf(INTEL.urlPhishingKeywords[pk]) >= 0) phishingHits.push(INTEL.urlPhishingKeywords[pk]);
  }
  if(phishingHits.length >= 2){
    score += 15;
    findings.push(mkFinding('medium', 'Multiple phishing keywords in path',
      'Path/query contains ' + phishingHits.length + ' phishing keywords: ' + phishingHits.slice(0,4).join(', ') + '. ' +
      'Legitimate sites rarely stack multiple urgency/credential terms into a URL.',
      15, {before:'matched: ', match: phishingHits.slice(0,4).join(', '), after:''}));
  }

  /* ---- Query checks ---- */
  var paramCount = 0;
  try { paramCount = Array.from(parsed.searchParams.keys()).length; } catch(e){}
  if(paramCount > 6){
    score += 5;
    findings.push(mkFinding('low', 'Many query parameters (' + paramCount + ')',
      'A high parameter count can indicate tracking, redirect chains, or payload smuggling.', 5));
  }
  if(/(redirect|url|next|target|goto|dest|return)=/i.test(parsed.search)){
    score+=8;
    findings.push(mkFinding('low','Redirect-style parameter present',
      'The query contains a parameter name commonly used for redirects. Endpoint behaviour was not tested, so an open redirect is not confirmed.',
      8,{before:'query: ',match:parsed.search.slice(0,80),after:' (behaviour not tested)'}));
  }

  /* ---- Scheme ---- */
  if(parsed.protocol !== 'https:'){
    score += 5;
    findings.push(mkFinding('low', 'Unencrypted HTTP connection',
      'The URL uses plain HTTP. Credentials and data submitted to this site travel unencrypted over the network.', 5));
  }

  /* ---- Bundled local demonstration indicators ---- */
  var listed=false,listedDomain='';
  for(var bl=0;bl<INTEL.blacklistDomains.length;bl++){
    var d=INTEL.blacklistDomains[bl];
    if(domainMatches(host,d)){listed=true;listedDomain=d;break;}
  }
  out.blacklist=listed?'MATCH (bundled demo list)':'No match in bundled demo list';
  if(listed){
    score+=60;
    findings.push(mkFinding('high','Bundled local indicator matched',
      '"'+host+'" matches bundled demonstration indicator "'+listedDomain+'". This is a local-list match, not a live threat-intelligence result. Verify against a current trusted source before operational use.',
      60,{before:'matched local indicator: ',match:listedDomain,after:' (bundled demo list; no live lookup)'}));
  }
  score=Math.max(0,Math.min(score,100));
  out.score=score;
  out.verdict=listed?'Listed (local demo indicator)':score>=15?'Suspicious':'No known threat found';
  out.reputation=listed?'Local indicator match':score>=15?'Needs review':'No known threat found';
  out.domain=host;
  out.threatIntel=listed?'Matched bundled local demonstration indicator; no live API queried':'No match in bundled local demonstration list; no live API queried';
  out.threatIntelSource='Bundled INTEL.blacklistDomains demo list';
  out.matchScope=listed?'Hostname/domain suffix: '+listedDomain:'No match';
  out.scanComplete=true;
  out.findings=findings;
  return out;
}

/* ==================== EMAIL ANALYSIS ======================== *//* ==================== EMAIL ANALYSIS ======================== */
function analyzeEmail(raw){
  var findings=[], score=0;
  var lower = raw.toLowerCase();

  // Parse headers (everything before first blank line)
  var headerEnd = raw.indexOf('\n\n');
  var headerSection = headerEnd >= 0 ? raw.slice(0, headerEnd) : raw.slice(0, 2000);
  var bodySection = headerEnd >= 0 ? raw.slice(headerEnd) : '';
  var headers = {};
  var headerLines = headerSection.split(/\r?\n/);
  var currentKey = null;
  for(var i=0;i<headerLines.length;i++){
    var line = headerLines[i];
    if(/^\s/.test(line) && currentKey){ headers[currentKey] += ' ' + line.trim(); continue; }
    var m = line.match(/^([A-Za-z-]+):\s*(.*)$/);
    if(m){ currentKey = m[1].toLowerCase(); headers[currentKey] = m[2]; }
  }
  function headerVal(k){ return headers[k] || ''; }

  var fromH = headerVal('from');
  var replyTo = headerVal('reply-to');
  var returnPath = headerVal('return-path');
  var subject = headerVal('subject');
  var received = headerVal('received');
  var authResults = headerVal('authentication-results');

  // From vs Reply-To mismatch
  if(fromH && replyTo && fromH !== replyTo){
    score += 15;
    findings.push(mkFinding('medium', 'Reply-To header does not match From',
      'The Reply-To header differs from the From header. This is a common spoofing tactic that routes the victim\'s ' +
      'reply to the attacker\'s mailbox while the From field impersonates a trusted sender.',
      15, {before:'From: ', match: fromH, after:'  |  Reply-To: ' + replyTo}));
  }
  if(fromH && returnPath && returnPath !== fromH){
    var fromDomain = (fromH.match(/@([^>\s]+)/)||[])[1] || '';
    var rpDomain = (returnPath.match(/@([^>\s]+)/)||[])[1] || '';
    if(fromDomain && rpDomain && fromDomain !== rpDomain){
      score += 20;
      findings.push(mkFinding('high', 'Return-Path domain mismatch',
        'The Return-Path (envelope sender) domain differs from the visible From domain. This indicates the message ' +
        'was likely sent via an unauthorised relay or with a spoofed From header — the classic signature of ' +
        'spoofed phishing email that will still deliver (SPF passes on the Return-Path, but From is faked).',
        20, {before:'From domain: ', match: fromDomain, after:'  |  envelope domain: ' + rpDomain}));
    }
  }

  // Sender domain checks
  if(fromH){
    var fdMatch = fromH.match(/@([^>\s]+)/);
    var fromDomain = fdMatch ? fdMatch[1].toLowerCase() : '';
    var fdParts = fromDomain.split('.');
    var fdTld = '.' + fdParts[fdParts.length-1];
    if(INTEL.suspiciousTLDs.indexOf(fdTld) >= 0){
      score += 15;
      findings.push(mkFinding('medium', 'Sender uses suspicious TLD',
        'The sender\'s domain "' + fromDomain + '" uses the TLD ' + fdTld + ', which has an elevated abuse rate.',
        15, {before:'From domain: ', match: fromDomain, after:''}));
    }
    // Punycode in From
    if(fromH.indexOf('xn--') >= 0){
      score += 40;
      findings.push(mkFinding('high', 'Punycode / IDN homograph sender domain',
        'The From header contains an internationalized (punycode) domain label. Attackers use visually identical ' +
        'Unicode characters to make the sender appear to come from a known brand (e.g. apple vs \\u0430pple).',
        40, {before:'From: ', match: fromH, after:''}));
    }
    // Brand in From but wrong real domain
    for(var b=0;b<INTEL.brandNames.length;b++){
      var brand = INTEL.brandNames[b];
      if(lower.indexOf(brand) >= 0 && fromDomain.indexOf(brand) < 0){
        score += 25;
        findings.push(mkFinding('high', 'Brand name in subject/body but not in sender domain',
          'The message mentions "' + brand + '" but was sent from "' + fromDomain + '" — a domain that does not ' +
          'belong to ' + brand + '. This is a classic brand-impersonation phishing pattern.',
          25, {before:'sender: ', match: fromDomain, after:'  |  mentioned brand: ' + brand}));
        break;
      }
    }
  }

  // Subject phishing
  var subjectLower = subject.toLowerCase();
  var subjHits = ['urgent','verify','suspended','locked','unusual','immediately','action required','confirm','password','account']
    .filter(function(w){ return subjectLower.indexOf(w) >= 0; });
  if(subjHits.length >= 2){
    score += 12;
    findings.push(mkFinding('medium', 'Phishing language in subject line',
      'The subject line contains ' + subjHits.length + ' urgency/credential keywords: ' + subjHits.join(', ') + '. ' +
      'Real transactional email rarely stacks multiple pressure terms like this.',
      12, {before:'subject: ', match: subject, after:''}));
  }

  // SPF / DKIM / DMARC
  if(authResults){
    if(/\bspf=fail\b/i.test(authResults)){
      score += 30;
      findings.push(mkFinding('high', 'SPF authentication failure',
        'The Authentication-Results header reports spf=fail. The sending server is not authorised to send mail for ' +
        'that domain — a strong indicator of spoofing or a compromised relay.',
        30, {before:'', match:'spf=fail', after:''}));
    }
    if(/\bdkim=fail\b/i.test(authResults)){
      score += 25;
      findings.push(mkFinding('high', 'DKIM authentication failure',
        'The Authentication-Results header reports dkim=fail. The message signature does not verify — the message ' +
        'has been modified in transit or was never legitimately signed by the claimed domain.',
        25, {before:'', match:'dkim=fail', after:''}));
    }
    if(/\bdmarc=fail\b/i.test(authResults)){
      score += 35;
      findings.push(mkFinding('high', 'DMARC authentication failure',
        'The Authentication-Results header reports dmarc=fail. The message fails the domain owner\'s DMARC policy — ' +
        'a definitive indication that the From header has been spoofed.',
        35, {before:'', match:'dmarc=fail', after:''}));
    }
  }

  // Received chain
  var receivedCount = (raw.match(/^Received:/gmi) || []).length;
  if(receivedCount > 6){
    score += 8;
    findings.push(mkFinding('low', 'Long Received chain (' + receivedCount + ' hops)',
      'The message passed through ' + receivedCount + ' mail servers. Unusually long chains can be used to hide ' +
      'the true origin of a message.', 8));
  }

  // Attachments
  var attachMatches = raw.match(/filename="?([^"\r\n]+)"?/gi) || [];
  var dangerousAttach = [];
  for(var a=0;a<attachMatches.length;a++){
    var fname = attachMatches[a].replace(/filename="?/i,'').replace(/"$/,'');
    var fext = (fname.split('.').pop()||'').toLowerCase();
    if(HIGH_RISK_EXT.indexOf(fext) >= 0 || MED_RISK_EXT.indexOf(fext) >= 0){
      dangerousAttach.push(fname);
    }
  }
  if(dangerousAttach.length > 0){
    score += 35;
    findings.push(mkFinding('high', 'Dangerous email attachment detected',
      'The email contains attachment(s) with executable or macro-capable extensions: ' + dangerousAttach.join(', ') + '. ' +
      'Malicious attachments are the primary delivery mechanism for ransomware and banking trojans ' +
      '(Emotet, QakBot, IcedID).',
      35, {before:'attachments: ', match: dangerousAttach.join(', '), after:''}));
  }

  // URL scan (both body + any URLs in headers)
  var urls = extractUrls(raw);
  for(var u=0;u<urls.length;u++){
    var r = analyzeUrl(urls[u]);
    if(r.score >= 35){
      score += 20;
      findings.push(mkFinding('high', 'Malicious link in email: ' + urls[u],
        'The link scored ' + r.score + '/100 on URL analysis (' + r.verdict + ').',
        20, {before:'URL: ', match: urls[u], after:'  (' + r.verdict + ')'}));
    } else if(r.score >= 15){
      score += 10;
      findings.push(mkFinding('medium', 'Suspicious link in email: ' + urls[u],
        'URL scored ' + r.score + '/100 — verdict ' + r.verdict + '.',
        10, {before:'URL: ', match: urls[u], after:''}));
    }
  }

  // Body phishing keywords
  var bodyLower = bodySection.toLowerCase();
  var bodyHits = 0;
  for(var i2=0;i2<INTEL.urlPhishingKeywords.length;i2++){
    var kw = INTEL.urlPhishingKeywords[i2];
    if(bodyLower.indexOf(kw) >= 0){
      bodyHits++;
      if(bodyHits <= 4){
        score += 6;
        findings.push(mkFinding('medium', 'Phishing language in body: "' + kw + '"',
          'The body contains the phrase "' + kw + '". These terms are typical of credential-harvesting messages ' +
          '(urgency, verification, account-threat framing).',
          6, {before:'', match: kw, after:''}));
      }
    }
  }

  return { score: Math.min(score,100), findings:findings,
           meta:{ from:fromH, replyTo:replyTo, returnPath:returnPath, subject:subject,
                  links:urls.length, attachments:dangerousAttach, receivedHops:receivedCount,
                  authResults:authResults } };
}

/* ==================== METADATA ============================== */
function extractMetadata(evidence, fileObj, callback){
  var md = { fileName:evidence.name, sizeBytes:evidence.size, sizeHuman:humanSize(evidence.size),
             mimeType:evidence.mime || 'unknown', sha256:evidence.sha256 || '-',
             uploadedAt:evidence.uploadedAt, caseId:evidence.caseId };
  var ext = (evidence.name.split('.').pop() || '').toLowerCase();
  if(fileObj && IMAGE_EXT.indexOf(ext) >= 0){
    try {
      var url = URL.createObjectURL(fileObj);
      var img = new Image();
      img.onload = function(){ md.width=img.width; md.height=img.height; URL.revokeObjectURL(url); callback(md); };
      img.onerror = function(){ URL.revokeObjectURL(url); callback(md); };
      img.src = url;
      return;
    } catch(e){}
  }
  callback(md);
}

/* ==================== RISK SCORE ============================ */
function generateRiskScore(parts){
  var total = 0;
  for(var i=0;i<parts.length;i++) total += (parts[i].score || 0);
  total = Math.min(total, 100);
  var level = total >= 60 ? 'high' : total >= 30 ? 'medium' : total > 0 ? 'low' : 'clean';
  return { score:total, level:level };
}

/* ==================== HASHING =============================== */
function sha256(bytes, callback){
  try {
    if(window.crypto && window.crypto.subtle){
      window.crypto.subtle.digest('SHA-256', bytes).then(function(buf){
        var arr = new Uint8Array(buf), hex = '';
        for(var i=0;i<arr.length;i++) hex += ('0'+arr[i].toString(16)).slice(-2);
        callback(hex);
      }).catch(function(){ callback(fallbackHash(bytes)); });
    } else callback(fallbackHash(bytes));
  } catch(e){ callback(fallbackHash(bytes)); }
}
function fallbackHash(bytes){
  var h = 5381;
  for(var i=0;i<bytes.length;i++) h = ((h<<5) + h + bytes[i]) >>> 0;
  return 'fallback-' + h.toString(16);
}

/* ==================== ANALYSIS RESULT PREP ================== */
function prepareAnalysisResult(evidence, bytes, text, fileObj, callback){
  var parts = [];
  if(evidence.type === 'url') parts.push(analyzeUrl(text));
  else if(evidence.type === 'email') parts.push(analyzeEmail(text));
  else parts.push(analyzeFile(evidence.name, evidence.size, bytes, text));

  var risk = generateRiskScore(parts);
  extractMetadata(evidence, fileObj, function(meta){
    var result = {
      id: uid('AN'), evidenceId: evidence.id, caseId: evidence.caseId,
      processedAt: new Date().toISOString(),
      riskScore: risk.score, riskLevel: risk.level,
      verdict: evidence.type === 'url' ? parts[0].verdict
             : risk.score >= 60 ? 'Malicious'
             : risk.score >= 30 ? 'Suspicious'
             : risk.score > 0   ? 'Low risk'
             : 'Clean',
      findings: [],
      urlDetail: evidence.type === 'url' ? parts[0] : null,
      emailDetail: evidence.type === 'email' ? parts[0].meta : null,
      metadata: meta
    };
    for(var i=0;i<parts.length;i++){
      var fs = parts[i].findings || [];
      for(var j=0;j<fs.length;j++) result.findings.push(fs[j]);
    }
    callback(result);
  });
}

/* ==================== REPORT ================================ */
function buildReport(caseObj, evidenceList, analysisList){
  var threats=0,suspicious=0,clean=0,incomplete=0,listedIndicators=0,highest=0;
  for(var i=0;i<analysisList.length;i++){
    var a=analysisList[i];
    if(a.verdict && /incomplete|unavailable|error/i.test(a.verdict)) incomplete++;
    else if(a.urlDetail){
      if(a.urlDetail.blacklist==='MATCH (bundled demo list)') listedIndicators++;
      if(a.urlDetail.verdict==='Suspicious'||a.urlDetail.verdict==='Invalid URL') suspicious++;
      else if(a.urlDetail.verdict==='No known threat found') clean++;
    } else if(a.riskLevel==='high') threats++;
    else if(a.riskLevel==='medium') suspicious++;
    else clean++;
    if(a.riskScore>highest)highest=a.riskScore;
  }
  var items=[];
  for(var k=0;k<analysisList.length;k++){
    var an=analysisList[k],ev=null;
    for(var e=0;e<evidenceList.length;e++)if(evidenceList[e].id===an.evidenceId){ev=evidenceList[e];break;}
    items.push({evidenceId:an.evidenceId,evidenceName:ev?ev.name:'unknown',type:ev?ev.type:'file',
      size:ev?ev.size:null,sha256:ev?ev.sha256:(an.metadata&&an.metadata.sha256)||'Unavailable',
      uploadedAt:ev?ev.uploadedAt:null,processedAt:an.processedAt,score:an.riskScore,level:an.riskLevel,
      verdict:an.urlDetail?an.urlDetail.verdict:an.verdict,findings:an.findings||[],
      urlDetail:an.urlDetail||null,emailDetail:an.emailDetail||null,metadata:an.metadata||null});
  }
  return {id:uid('RPT'),caseId:caseObj.id,caseName:caseObj.name,caseDescription:caseObj.description||'',
    caseStatus:caseObj.status||'Unknown',generatedAt:new Date().toISOString(),reportVersion:'TraceLens investigation report v1.1',
    summary:{totalEvidence:evidenceList.length,analysed:analysisList.length,threats:threats,suspicious:suspicious,
      clean:clean,incomplete:incomplete,listedIndicators:listedIndicators,highestScore:highest},
    limitations:[
      'URL reputation uses a small bundled demonstration indicator list; no live threat-intelligence API was queried.',
      'A local demo-indicator match is not equivalent to independent or live confirmation that a domain is malicious.',
      'Heuristic indicators are triage signals, not proof of malicious activity.',
      'No known threat found means only that the checks performed found no known indicator; it does not guarantee safety.',
      'Local browser storage is used by this prototype and is not a tamper-proof forensic evidence store.'
    ],items:items};
}

function toast(msg){

  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
function riskBadge(level){
  var map = { high:'b-high', medium:'b-med', low:'b-low', clean:'b-low' };
  var label = { high:'High', medium:'Medium', low:'Low', clean:'Clean' };
  return '<span class="badge ' + (map[level]||'b-info') + '">' + (label[level]||level) + '</span>';
}
function riskColor(level){
  return { high:'var(--high)', medium:'var(--med)', low:'var(--low)', clean:'var(--low)' }[level] || 'var(--muted)';
}

function renderInstallBanner(){

}

    if(type === 'url' || (type === 'email' && !f && textVal)){

      var name = type === 'url' ? textVal : ('Email-' + Date.now() + '.eml');
      var size = new Blob([textVal]).size;
      var mime = type === 'url' ? 'text/uri-list' : 'message/rfc822';
      var bytes = new TextEncoder().encode(textVal);

      if(type === 'file' && ext === 'eml') actualType = 'email';
      var text = isTextLike(bytes) ? new TextDecoder('utf-8').decode(bytes) : null;
      persistAndAnalyze(caseId, actualType, f.name, f.size, f.type || 'application/octet-stream', bytes, text, f, btn);
    };
    reader.onerror = function(){ fail('Failed to read file'); };
    reader.readAsArrayBuffer(f);
  };
}

function persistAndAnalyze(caseId, type, name, size, mime, bytes, text, fileObj, btn){
  sha256(bytes, function(hash){
    var evidence = { id:uid('EV'), caseId:caseId, name:name, size:size, mime:mime, type:type,
                     sha256:hash, uploadedAt:new Date().toISOString(),
                     uploadedBy:Auth.current()?Auth.current().username:'unknown' };
    var evAll = DB.evidence(); evAll.push(evidence); DB.saveEvidence(evAll);
    prepareAnalysisResult(evidence, bytes, text, fileObj, function(analysis){
      var anAll = DB.analysis(); anAll.push(analysis); DB.saveAnalysis(anAll);
      closeModal();
      toast('Analysis complete - '+analysis.verdict+' ('+analysis.riskScore+'/100)');
      navigate('case', caseId);
    });
  });
}

function showAnalysis(analysisId){
  var a = null, allAn = DB.analysis();
  for(var i=0;i<allAn.length;i++) if(allAn[i].id === analysisId){ a = allAn[i]; break; }
  if(!a) return;
  var ev = null, allEv = DB.evidence();
  for(var e=0;e<allEv.length;e++) if(allEv[e].id === a.evidenceId){ ev = allEv[e]; break; }

  var html = '<h3>Analysis Result - Process 4.6</h3>' +
    '<div class="row-flex" style="margin-bottom:14px">' + riskBadge(a.riskLevel) +
      '<b style="font-size:22px">'+a.riskScore+'<span style="color:var(--muted);font-size:14px">/100</span></b>' +
      '<span class="badge b-info">'+a.verdict+'</span><div class="spacer"></div>' +
      '<span style="color:var(--muted);font-size:12px">'+fmtDate(a.processedAt)+'</span></div>' +
    '<div class="score-bar"><span>0</span><div class="track"><div class="fill" style="width:'+a.riskScore+'%;background:'+riskColor(a.riskLevel)+'"></div></div><span>100</span></div>' +
    '<div class="sec-title">Evidence</div>' +
    '<div class="kv"><div class="k">Name</div><div class="v">'+esc(ev?ev.name:'-')+'</div>' +
      '<div class="k">Type</div><div class="v">'+(ev?ev.type:'-')+'</div>' +
      '<div class="k">Size</div><div class="v">'+(ev?humanSize(ev.size):'-')+'</div>' +
      '<div class="k">SHA-256</div><div class="v">'+a.metadata.sha256+'</div>' +
      (a.metadata.width?'<div class="k">Dimensions</div><div class="v">'+a.metadata.width+' x '+a.metadata.height+'</div>':'') +
    '</div>';

  if(a.urlDetail){
    html += '<div class="sec-title">URL Analysis</div><div class="kv">' +
      '<div class="k">Syntax</div><div class="v">'+esc(a.urlDetail.syntax)+'</div>' +
      '<div class="k">Reputation</div><div class="v">'+esc(a.urlDetail.reputation)+'</div>' +
      '<div class="k">Bundled indicator list</div><div class="v">'+esc(a.urlDetail.blacklist)+'</div>' +
      '<div class="k">Hostname</div><div class="v">'+esc(a.urlDetail.domain)+'</div>' +
      '<div class="k">Threat-intelligence result</div><div class="v">'+esc(a.urlDetail.threatIntel)+'</div>' +
      '<div class="k">Match scope</div><div class="v">'+esc(a.urlDetail.matchScope||'No match')+'</div>' +
      '<div class="k">Verdict</div><div class="v">'+esc(a.urlDetail.verdict)+' ('+a.urlDetail.score+'/100)</div></div>';
  }
  if(a.emailDetail){
    html += '<div class="sec-title">Email Headers</div><div class="kv">' +
      '<div class="k">From</div><div class="v">'+esc(a.emailDetail.from||'-')+'</div>' +
      '<div class="k">Reply-To</div><div class="v">'+esc(a.emailDetail.replyTo||'-')+'</div>' +
      '<div class="k">Return-Path</div><div class="v">'+esc(a.emailDetail.returnPath||'-')+'</div>' +
      '<div class="k">Subject</div><div class="v">'+esc(a.emailDetail.subject||'-')+'</div>' +
      '<div class="k">Received hops</div><div class="v">'+(a.emailDetail.receivedHops||0)+'</div>' +
      '<div class="k">Links found</div><div class="v">'+a.emailDetail.links+'</div>' +
      (a.emailDetail.attachments && a.emailDetail.attachments.length ?
        '<div class="k">Attachments</div><div class="v" style="color:var(--high)">'+esc(a.emailDetail.attachments.join(', '))+'</div>' : '') +
      (a.emailDetail.authResults ?
        '<div class="k">Auth-Results</div><div class="v">'+esc(a.emailDetail.authResults)+'</div>' : '') +
    '</div>';
  }

  html += '<div class="sec-title">Findings ('+a.findings.length+')</div>';
  if(a.findings.length === 0){
    html += '<div class="card empty" style="padding:24px;border-color:var(--low)">' +

  } else {
    // Sort by severity
    var order = { high:0, medium:1, low:2 };
    a.findings.sort(function(x,y){ return (order[x.severity]||9) - (order[y.severity]||9); });

function generateReport(caseId){
  var c = null, cases = DB.cases();
  for(var i=0;i<cases.length;i++) if(cases[i].id === caseId){ c = cases[i]; break; }
  if(!c) return;
  var ev = [], an = [], allEv = DB.evidence(), allAn = DB.analysis();
  for(var e=0;e<allEv.length;e++) if(allEv[e].caseId === caseId) ev.push(allEv[e]);
  for(var a=0;a<allAn.length;a++) if(allAn[a].caseId === caseId) an.push(allAn[a]);
  if(an.length === 0){ toast('No analysed evidence to report on'); return; }
  var rpt = buildReport(c, ev, an);
  var all = DB.reports(); all.push(rpt); DB.saveReports(all);
  toast('Report generated'); viewReport(rpt.id);
}
window.generateReport = generateReport;
