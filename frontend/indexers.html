<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1117" />
<meta name="description" content="AI Powered Digital Forensics & Investigation Platform" />
<link rel="manifest" href='data:application/manifest+json,{"name":"AI Digital Forensics","short_name":"DFI Platform","start_url":".","display":"standalone","background_color":"%230d1117","theme_color":"%230d1117","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2732%27 fill=%27%230d1117%27/%3E%3Ccircle cx=%2796%27 cy=%2796%27 r=%2764%27 fill=%27none%27 stroke=%27%232f81f7%27 stroke-width=%278%27/%3E%3Ccircle cx=%2796%27 cy=%2796%27 r=%2716%27 fill=%27%232f81f7%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}' />
<title>AI Digital Forensics &amp; Investigation Platform</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --accent2:#58a6ff;
    --high:#f85149; --med:#d29922; --low:#3fb950; --info:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  .screen{display:none} .screen.active{display:block}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;
         padding:9px 16px;font-size:14px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--panel2)}
  .btn-danger{background:transparent;color:var(--high);border:1px solid rgba(248,81,73,.45)}
  .btn-danger:hover{background:rgba(248,81,73,.12)}
  .btn-link{background:transparent;color:var(--accent);text-decoration:none;font-weight:600;padding:0;border:none}
  .btn-link:hover{text-decoration:underline}
  input,textarea,select{font-family:inherit;font-size:14px;background:var(--panel2);
    color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 12px;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;
        text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px}

  #login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%,#12233f 0%,#0d1117 60%)}
  #login-screen.active{display:flex}
  .login-box{width:420px;padding:32px}
  .login-box h1{font-size:20px;margin-bottom:4px}
  .login-box .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .auth-tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .auth-tab{flex:1;padding:10px;background:transparent;border:none;color:var(--muted);
    font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer;border-radius:0}
  .auth-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .login-error{color:var(--high);font-size:13px;margin-top:10px;min-height:18px}
  .login-success{color:var(--low);font-size:13px;margin-top:10px;min-height:18px}
  .creds-hint{margin-top:16px;padding:10px;background:var(--panel2);border-radius:6px;
    font-size:12px;color:var(--muted);border-left:3px solid var(--accent)}

  header{display:none;align-items:center;justify-content:space-between;padding:12px 24px;
    background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  #app.active header{display:flex}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .user-chip{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .layout{display:none;min-height:calc(100vh - 57px)}
  #app.active .layout{display:flex}
  aside{width:230px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
  aside a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;
    color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:2px;cursor:pointer}
  aside a:hover{background:var(--panel2);color:var(--text)}
  aside a.active{background:var(--accent);color:#fff}
  main{flex:1;padding:24px 32px;max-width:1400px;overflow-x:hidden}

  h2.page-title{font-size:22px;margin-bottom:4px}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:20px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .stat .num{font-size:28px;font-weight:700}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
     color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:var(--panel2)}
  .clickable{cursor:pointer}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
         text-transform:uppercase;letter-spacing:.04em}
  .b-high{background:rgba(248,81,73,.15);color:var(--high);border:1px solid rgba(248,81,73,.4)}
  .b-med {background:rgba(210,153,34,.15);color:var(--med);border:1px solid rgba(210,153,34,.4)}
  .b-low {background:rgba(63,185,80,.15);color:var(--low);border:1px solid rgba(63,185,80,.4)}
  .b-info{background:rgba(88,166,255,.15);color:var(--info);border:1px solid rgba(88,166,255,.4)}

  .risk-bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
  .risk-fill{height:100%}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
    align-items:flex-start;justify-content:center;z-index:100;padding:24px;overflow-y:auto}
  .overlay.active{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    width:100%;max-width:820px;max-height:none;padding:26px;margin:20px 0}
  .modal h3{font-size:18px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

  .finding{border-left:3px solid var(--border);padding:12px 15px;margin-bottom:10px;
    background:var(--panel2);border-radius:0 6px 6px 0}
  .finding.high{border-left-color:var(--high)}
  .finding.medium{border-left-color:var(--med)}
  .finding.low{border-left-color:var(--low)}
  .finding .t{font-weight:700;font-size:13.5px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .finding .pts{font-size:11px;font-weight:600;background:var(--panel);padding:1px 8px;border-radius:10px;color:var(--muted);flex-shrink:0}
  .finding .d{color:var(--muted);font-size:13px;line-height:1.55}
  .finding .ev{margin-top:8px;background:#0a0e13;border:1px solid #20262e;border-radius:6px;
    padding:9px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    color:#c9d1d9;overflow-x:auto;white-space:pre-wrap;word-break:break-all;line-height:1.55}
  .finding .ev mark{background:rgba(248,81,73,.35);color:#ffd7d5;padding:1px 3px;border-radius:3px;
    border:1px solid rgba(248,81,73,.5)}
  .finding.medium .ev mark{background:rgba(210,153,34,.3);color:#ffe6b3;border-color:rgba(210,153,34,.5)}
  .finding.low .ev mark{background:rgba(63,185,80,.25);color:#c3f0ca;border-color:rgba(63,185,80,.5)}

  .kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:13.5px;margin:10px 0}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}

  .empty{color:var(--muted);text-align:center;padding:44px;font-size:14px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--border);
    border-left:4px solid var(--accent);padding:13px 18px;border-radius:8px;z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13.5px;display:none;max-width:400px}
  .toast.show{display:block;animation:slide .3s}
  @keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:22px 0 10px;font-weight:700}
  code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12.5px}
  .row-flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .score-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
  .score-bar .track{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
  .score-bar .fill{height:100%;background:var(--high)}
  .install-banner{background:linear-gradient(90deg,rgba(47,129,247,.15),transparent);
    border:1px solid rgba(47,129,247,.4);border-radius:8px;padding:12px 16px;
    display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:13.5px}
  .stat{position:relative;overflow:hidden;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
  .stat:hover{transform:translateY(-2px);border-color:rgba(88,166,255,.55);box-shadow:0 10px 26px rgba(0,0,0,.18)}
  .stat .num{font-variant-numeric:tabular-nums;letter-spacing:-.035em}
  main{min-width:0}.page-title{letter-spacing:-.025em}
  @media(max-width:900px){
    header{padding:12px 16px}.layout{flex-direction:column}
    aside{width:100%;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
    aside a{white-space:nowrap;margin:0}main{padding:20px 16px}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:520px){
    .user-chip{gap:6px;font-size:11px}.stats{grid-template-columns:1fr 1fr;gap:8px}
    .stat{padding:12px}.stat .num{font-size:23px}.card{padding:14px}
    .kv{grid-template-columns:1fr;gap:3px}.kv .k{margin-top:5px}
    .overlay{padding:8px}.modal{padding:16px;margin:8px 0}.modal-actions{flex-wrap:wrap}
  }
</style>
</head>
<body>

<!-- ==================== LOGIN / REGISTER ==================== -->
<div id="login-screen" class="screen active">
  <div class="card login-box">
    <h1>AI Digital Forensics</h1>
    <div class="sub">Investigation Platform &mdash; v1.0</div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" type="button">Sign In</button>
      <button class="auth-tab" id="tab-register" type="button">Register</button>
    </div>

    <!-- Sign-in form -->
    <form id="login-form" autocomplete="off">
      <label>Investigator ID</label>
      <input id="login-user" autocomplete="username" placeholder="e.g. investigator" />
      <label>Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="........" />
      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" style="width:100%;margin-top:8px" type="submit">Authenticate</button>
    </form>

    <!-- Register form -->
    <form id="register-form" autocomplete="off" style="display:none">
      <label>Investigator ID</label>
      <input id="reg-user" placeholder="Choose a unique ID (4-32 chars)" />
      <label>Full Name</label>
      <input id="reg-name" placeholder="e.g. Jane Doe" />
      <label>Password</label>
      <input id="reg-pass" type="password" placeholder="Minimum 6 characters" />
      <label>Confirm Password</label>
      <input id="reg-pass2" type="password" placeholder="Re-enter password" />
      <div class="login-error" id="reg-error"></div>
      <div class="login-success" id="reg-success"></div>
      <button class="btn-primary" style="width:100%;margin-top:8px" type="submit">Create Account</button>
    </form>

    <div class="creds-hint">
      <b>Demo credentials:</b> ID: <code>investigator</code> &middot; Password: <code>Admin@123</code>
      <div id="storage-status" style="margin-top:10px;font-size:11.5px"></div>
    </div>
  </div>
</div>

<!-- ==================== APPLICATION ==================== -->
<div id="app" class="screen">
  <header>
    <div class="brand"><span class="dot"></span> AI Digital Forensics &amp; Investigation Platform</div>
    <div class="user-chip">
      <span id="hdr-user"></span>
      <button class="btn-ghost" id="logout-btn">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <a data-route="dashboard">Dashboard</a>
      <a data-route="cases">Cases</a>
      <a data-route="reports">Reports</a>
      <a data-route="trace">SRS Traceability</a>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
console.log('[DFI] Script starting...');

/* --------------------------- CONFIG --------------------------- */
var CONFIG = {
  MAX_LOGIN_ATTEMPTS: 5,
  MAX_UPLOAD_MB: 25,
  SESSION_KEY: 'dfi_session',
  LOCK_KEY: 'dfi_lock'
};

/* --------------------- SAFE STORAGE --------------------------- */
var MemStore = {};
var HAS_LS = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
var HAS_SS = (function(){ try{ sessionStorage.setItem('__t','1'); sessionStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
var Store = {
  get:function(k){ if(HAS_LS){ try{ return localStorage.getItem(k); }catch(e){} } return MemStore[k]!==undefined?MemStore[k]:null; },
  set:function(k,v){ if(HAS_LS){ try{ localStorage.setItem(k,v); return; }catch(e){} } MemStore[k]=v; },
  remove:function(k){ if(HAS_LS){ try{ localStorage.removeItem(k); }catch(e){} } delete MemStore[k]; }
};
var Session = {
  get:function(k){ if(HAS_SS){ try{ return sessionStorage.getItem(k); }catch(e){} } return MemStore['__s__'+k]!==undefined?MemStore['__s__'+k]:null; },
  set:function(k,v){ if(HAS_SS){ try{ sessionStorage.setItem(k,v); return; }catch(e){} } MemStore['__s__'+k]=v; },
  remove:function(k){ if(HAS_SS){ try{ sessionStorage.removeItem(k); }catch(e){} } delete MemStore['__s__'+k]; }
};

/* ---------------------------- D1-D5 --------------------------- */
var DB = {
  read:function(k){ try{ var r=Store.get(k); if(!r) return []; var v=JSON.parse(r); return Array.isArray(v)?v:[]; }catch(e){ return []; } },
  write:function(k,v){ try{ Store.set(k, JSON.stringify(v)); }catch(e){} },
  users:function(){return this.read('d1_users')}, saveUsers:function(v){this.write('d1_users',v)},
  cases:function(){return this.read('d2_cases')}, saveCases:function(v){this.write('d2_cases',v)},
  evidence:function(){return this.read('d3_evidence')}, saveEvidence:function(v){this.write('d3_evidence',v)},
  analysis:function(){return this.read('d4_analysis')}, saveAnalysis:function(v){this.write('d4_analysis',v)},
  reports:function(){return this.read('d5_reports')}, saveReports:function(v){this.write('d5_reports',v)}
};
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------------------- HASHING ------------------------- */
function quickHash(str){
  var h = 5381, i = str.length;
  while(i) h = (h*33) ^ str.charCodeAt(--i);
  return (h>>>0).toString(36);
}
function fullHash(s){ return quickHash('a|'+s) + quickHash('b|'+s); }

/* ------------------------- AUTHENTICATION --------------------- */
var Auth = {
  seed: function(){
    try {
      if(!DB.users().length){
        DB.saveUsers([{ id:'U-001', username:'investigator',
          passwordHash: fullHash('Admin@123'), name:'Investigator', role:'Investigator',
          created:new Date().toISOString() }]);
        console.log('[DFI] Seeded default user.');
      }
    } catch(e){ console.error('[DFI] Seed failed:', e); }
  },
  current: function(){ try{ var r=Session.get(CONFIG.SESSION_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
  login: function(username, password){
    username = String(username||'').trim(); password = String(password||'');
    if(!username || !password) return { ok:false, msg:'Please enter both ID and password.' };
    var lock = {};
    try{ lock = JSON.parse(Store.get(CONFIG.LOCK_KEY) || '{}'); }catch(e){ lock = {}; }
    if(lock[username] && lock[username].until > Date.now()){
      var secs = Math.ceil((lock[username].until - Date.now())/1000);
      return { ok:false, msg:'Account locked. Try again in ' + secs + 's.' };
    }
    var users = DB.users(), user = null;
    var ph = fullHash(password);
    for(var i=0; i<users.length; i++) if(users[i].username === username && users[i].passwordHash === ph){ user = users[i]; break; }
    if(user){
      try{ delete lock[username]; Store.set(CONFIG.LOCK_KEY, JSON.stringify(lock)); }catch(e){}
      try{ Session.set(CONFIG.SESSION_KEY, JSON.stringify(user)); }catch(e){}
      return { ok:true, user:user };
    }
    if(!lock[username]) lock[username] = { fails:0, until:0 };
    lock[username].fails = (lock[username].fails || 0) + 1;
    if(lock[username].fails >= CONFIG.MAX_LOGIN_ATTEMPTS){
      lock[username].until = Date.now() + 30000; lock[username].fails = 0;
    }
    try{ Store.set(CONFIG.LOCK_KEY, JSON.stringify(lock)); }catch(e){}
    return { ok:false, msg:'Invalid credentials.' };
  },
  register: function(username, name, password, password2){
    username = String(username||'').trim();
    name = String(name||'').trim();
    if(!username || username.length < 4 || username.length > 32) return { ok:false, msg:'Investigator ID must be 4-32 characters.' };
    if(!/^[a-zA-Z0-9_.-]+$/.test(username)) return { ok:false, msg:'ID may only contain letters, digits, dot, dash, underscore.' };
    if(!name || name.length < 2) return { ok:false, msg:'Please enter your full name.' };
    if(!password || password.length < 6) return { ok:false, msg:'Password must be at least 6 characters.' };
    if(password !== password2) return { ok:false, msg:'Passwords do not match.' };
    var users = DB.users();
    for(var i=0; i<users.length; i++) if(users[i].username.toLowerCase() === username.toLowerCase()){
      return { ok:false, msg:'That Investigator ID is already registered.' };
    }
    var user = {
      id: 'U-' + String(users.length + 1).padStart(3,'0'),
      username: username, name: name,
      passwordHash: fullHash(password), role: 'Investigator',
      created: new Date().toISOString()
    };
    users.push(user); DB.saveUsers(users);
    return { ok:true, user:user };
  },
  logout: function(){ try{ Session.remove(CONFIG.SESSION_KEY); }catch(e){} }
};

/* ======================== THREAT INTEL ====================== */
var INTEL = {
  blacklistDomains: ['malware-test.com','evil-c2.net','phish-login.tk','badhost.ru','free-robux.xyz',
    'suspicious-domain.tk','paypal-security-alert.com','microsoft-verify.info','apple-id-locked.tk',
    'amazon-billing-problem.xyz','netflix-payment-update.top','facebook-security.tk',
    'google-verify-account.ga','bankofamerica-alert.tk','whatsapp-verify.ml','crypto-giveaway.com',
    'wallstreetbets-crypto.xyz','metamask-verify.com','opensea-airdrop.xyz','uniswap-rewards.top'],
  suspiciousTLDs: ['.tk','.ml','.ga','.cf','.gq','.top','.xyz','.click','.country','.work','.loan',
    '.review','.stream','.download','.racing','.party','.gdn','.bid','.accountant','.win','.men','.date','.faith'],
  shorteners: ['bit.ly','tinyurl.com','goo.gl','t.co','ow.ly','is.gd','buff.ly','rebrand.ly','cutt.ly','rb.gy'],
  brandNames: ['google','facebook','paypal','apple','microsoft','amazon','netflix','whatsapp','instagram',
    'linkedin','twitter','bankofamerica','wellsfargo','chase','citibank','dropbox','adobe','github','steam',
    'metamask','coinbase','binance','opensea','roblox','discord','telegram','dhl','fedex','usps'],
  urlPhishingKeywords: ['login','signin','sign-in','verify','verification','account','update','secure',
    'banking','confirm','password','wallet','recovery','unlock','billing','payment','authorize','validate',
    'alert','suspended','locked','restricted','unusual'],
  maliciousFileKeywords: ['mimikatz','powershell -enc','powershell -e ','invoke-expression','iex(',
    'meterpreter','reverse shell','keylogger','ransomware','wannacry','nc -e','cmd.exe /c','cmd.exe /k',
    '/etc/shadow','base64 -d','curl http','wget http','psexec','procdump','netcat','nc.exe','ncat',
    'mshta http','regsvr32 /s /u /i','rundll32 javascript','certutil -urlcache','bitsadmin /transfer',
    'vssadmin delete shadows','bcdedit /set','wbadmin delete','wevtutil cl'],
  malwareFamilies: ['mimikatz','meterpreter','cobaltstrike','cobalt strike','njrat','quasar','darkcomet',
    'remcos','nanocore','agenttesla','emotet','trickbot','ryuk','conti','revil','lockbit','blackcat',
    'hawkeye','lokibot','formbook','azorult','raccoon','vidar','gandcrab','darkside','petya','wannacry',
    'notpetya','badrabbit','avaddon','dearcry','teslacrypt','cerber','phobos','dharma','qakbot','icedid'],

var HIGH_RISK_EXT = ['exe','dll','scr','bat','cmd','vbs','vbe','ps1','psm1','js','jse','jar','msi','hta','wsf','cpl','reg','lnk','pif','com','gadget','sys','drv','ocx'];

var IMAGE_EXT     = ['jpg','jpeg','png','gif','bmp','webp','tiff','tif'];
var MAGIC = [
  {exts:['jpg','jpeg'], type:'JPEG image',        sig:[0xFF,0xD8,0xFF]},
  {exts:['png'],        type:'PNG image',         sig:[0x89,0x50,0x4E,0x47]},
  {exts:['gif'],        type:'GIF image',         sig:[0x47,0x49,0x46,0x38]},
  {exts:['pdf'],        type:'PDF document',      sig:[0x25,0x50,0x44,0x46]},
  {exts:['zip','docx','xlsx','pptx','jar','apk','odt'], type:'ZIP archive', sig:[0x50,0x4B,0x03,0x04]},
  {exts:['exe','dll','sys','scr','ocx'], type:'Windows PE binary', sig:[0x4D,0x5A]},
  {exts:['rar'],        type:'RAR archive',       sig:[0x52,0x61,0x72,0x21]},
  {exts:['7z'],        type:'7-Zip archive',     sig:[0x37,0x7A,0xBC,0xAF]},
  {exts:['bmp'],        type:'BMP image',         sig:[0x42,0x4D]},
  {exts:['tiff','tif'], type:'TIFF image',        sig:[0x49,0x49,0x2A,0x00]},
  {exts:['elf'],        type:'ELF binary',        sig:[0x7F,0x45,0x4C,0x46]}
