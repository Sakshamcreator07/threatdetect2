    '<div class="k">Generated</div><div class="v">'+fmtDate(r.generatedAt)+'</div>' +
    '<div class="k">Evidence items</div><div class="v">'+r.summary.totalEvidence+'</div>' +
    '<div class="k">High risk / Listed local indicators / Suspicious / No known threat</div>' +
    '<div class="v"><span style="color:var(--high)">'+r.summary.threats+'</span> / ' +
    '<span style="color:var(--med)">'+(r.summary.listedIndicators||0)+'</span> / ' +
    '<span style="color:var(--med)">'+r.summary.suspicious+'</span> / ' +
    '<span style="color:var(--low)">'+r.summary.clean+'</span></div>' +
    '<div class="k">Highest risk score</div><div class="v">'+r.summary.highestScore+'/100</div></div>' +
    '<div class="sec-title">Per-evidence findings</div>';
  for(var it=0; it<r.items.length; it++){
    var item = r.items[it];
    html += '<div class="card" style="margin-bottom:10px;padding:14px"><div class="row-flex">' +
      '<b>'+esc(item.evidenceName)+'</b><span class="badge b-info">'+item.type+'</span>' +
      riskBadge(item.level) + '<span style="color:var(--muted);font-size:12.5px">'+item.score+'/100 - '+item.verdict+'</span></div>';
    if(item.findings.length === 0){
      html += '<div style="color:var(--low);font-size:13px;margin-top:6px">No indicators detected.</div>';
    } else {
      html += '<ul style="margin:8px 0 0 18px;color:var(--muted);font-size:13px">';
      for(var f=0;f<item.findings.length;f++){
        html += '<li><b>'+esc(item.findings[f].title)+'</b> - '+esc(item.findings[f].detail)+'</li>';
      }
      html += '</ul>';
    }
    html += '</div>';
  }
  html += '<div class="modal-actions"><button class="btn-ghost" id="rp-close">Close</button>' +
    '<button class="btn-primary" id="rp-dl">Print / Save as PDF</button></div>';
  modal.innerHTML = html;
  overlay.classList.add('active');
  document.getElementById('rp-close').onclick = closeModal;
  document.getElementById('rp-dl').onclick = function(){ downloadReport(r.id); };
}
window.viewReport = viewReport;

function downloadReport(id){
  var r = null, all = DB.reports();
  for(var i=0;i<all.length;i++) if(all[i].id === id){ r = all[i]; break; }
  if(!r) return;
  var reportEsc = function(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); };
  var dateText = function(value){ return value ? reportEsc(fmtDate(value)) : 'Unavailable'; };
  var itemsHtml = '';
  for(var it=0; it<(r.items||[]).length; it++){
    var item = r.items[it] || {};
    itemsHtml += '<section class="evidence"><h3>' + reportEsc(item.evidenceName || 'Unknown evidence') +
      '</h3><p class="meta">Type: ' + reportEsc(item.type || 'unknown') + ' · Verdict: <strong class="' +
      reportEsc(item.level || 'info') + '">' + reportEsc(item.verdict || 'Not classified') + '</strong> · Risk score: ' +
      reportEsc(item.score == null ? 'N/A' : item.score) + '/100</p>' +
      '<dl><dt>Evidence ID</dt><dd>' + reportEsc(item.evidenceId || 'Unavailable') + '</dd>' +
      '<dt>SHA-256</dt><dd class="mono">' + reportEsc(item.sha256 || 'Unavailable') + '</dd>' +
      '<dt>Size</dt><dd>' + reportEsc(item.size == null ? 'Unavailable' : humanSize(item.size)) + '</dd>' +
      '<dt>Uploaded</dt><dd>' + dateText(item.uploadedAt) + '</dd><dt>Analysed</dt><dd>' + dateText(item.processedAt) + '</dd></dl>';
    if(item.urlDetail){
      var u=item.urlDetail;
      itemsHtml += '<h4>URL assessment</h4><dl><dt>Hostname</dt><dd class="mono">' + reportEsc(u.domain || 'Unavailable') +
       '</dd><dt>Syntax</dt><dd>' + reportEsc(u.syntax || 'Unavailable') + '</dd><dt>Local indicator result</dt><dd>' +
       reportEsc(u.blacklist || 'Unavailable') + '</dd><dt>Threat-intelligence note</dt><dd>' +
       reportEsc(u.threatIntel || 'Unavailable') + '</dd><dt>Match scope</dt><dd>' + reportEsc(u.matchScope || 'Unavailable') +
       '</dd><dt>Source</dt><dd>' + reportEsc(u.threatIntelSource || 'Unavailable') + '</dd></dl>';
    }
    if(item.emailDetail){
      var em=item.emailDetail;
      itemsHtml += '<h4>Email analysis</h4><dl><dt>From</dt><dd>'+reportEsc(em.from||'Unavailable')+
        '</dd><dt>Reply-To</dt><dd>'+reportEsc(em.replyTo||'Unavailable')+'</dd><dt>Subject</dt><dd>'+
        reportEsc(em.subject||'Unavailable')+'</dd><dt>Authentication results</dt><dd>'+
        reportEsc(em.authResults||'Unavailable')+'</dd></dl>';
    }
    if(item.metadata){
      var m=item.metadata;
      itemsHtml += '<h4>File metadata</h4><dl><dt>MIME type</dt><dd>' + reportEsc(m.mime || m.mimeType || 'Unavailable') +
        '</dd><dt>File name</dt><dd>' + reportEsc(m.name || item.evidenceName || 'Unavailable') + '</dd>';
      if(m.width) itemsHtml += '<dt>Image dimensions</dt><dd>' + reportEsc(m.width) + ' × ' + reportEsc(m.height) + '</dd>';
      itemsHtml += '</dl>';
    }
    var fs=item.findings||[];
    itemsHtml += '<h4>Findings ('+fs.length+')</h4>';
    if(!fs.length) itemsHtml += '<p>No heuristic findings recorded. This does not guarantee the artifact is safe.</p>';
    else {
      itemsHtml += '<ol class="findings">';
      for(var f=0;f<fs.length;f++){
        var fd=fs[f]||{};
        itemsHtml += '<li><strong>'+reportEsc(fd.title||'Finding')+'</strong> '+
          (fd.points?'<span class="points">+'+reportEsc(fd.points)+' points</span>':'')+
          '<p>'+reportEsc(fd.detail||'')+'</p>';
        if(fd.snippet) itemsHtml += '<pre>'+reportEsc((fd.snippet.before||'')+'['+(fd.snippet.match||'')+']'+(fd.snippet.after||''))+'</pre>';
        itemsHtml += '</li>';
      }
      itemsHtml += '</ol>';
    }
    itemsHtml += '</section>';
  }
  var summary=r.summary||{};
  var limitations=(r.limitations||[
    'URL reputation uses locally bundled demonstration indicators; no live threat-intelligence API was queried.',
    'Heuristic indicators are triage signals, not proof of malicious activity.',
    'No known threat found does not guarantee safety.'
  ]).map(function(x){return '<li>'+reportEsc(x)+'</li>';}).join('');
  var html='<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>TraceLens Investigation Report '+reportEsc(r.id)+'</title><style>'+
    '@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#182230;max-width:900px;margin:24px auto;padding:0 24px;font-size:12px;line-height:1.5}'+
    'header{border-bottom:3px solid #2563eb;padding-bottom:16px;margin-bottom:20px}h1{font-size:25px;margin:0 0 3px}h2{font-size:16px;margin:22px 0 9px;border-bottom:1px solid #d5dbe5;padding-bottom:5px}h3{font-size:15px;margin:0 0 7px}h4{font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:#4b5563}'+
    '.meta{color:#596579;font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid #d5dbe5;border-radius:7px;padding:10px}.metric b{font-size:18px;display:block}.evidence{border:1px solid #d5dbe5;border-radius:7px;padding:13px;margin:12px 0;break-inside:avoid}'+
    'dl{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;margin:9px 0}dt{color:#596579}dd{margin:0;overflow-wrap:anywhere}.mono,pre{font-family:Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#f3f5f8;padding:7px;border-radius:4px}.findings{padding-left:20px}.findings li{margin:9px 0}.points{color:#586273;font-size:10px}.high{color:#b42318}.medium{color:#9a6700}.low,.clean{color:#16803c}.info{color:#2563eb}.notice{background:#f4f7fb;padding:10px;border-left:3px solid #2563eb}footer{border-top:1px solid #d5dbe5;margin-top:24px;padding-top:8px;color:#596579;font-size:10px}'+
    '@media print{body{margin:0;max-width:none;padding:0}.no-print{display:none!important}.evidence{break-inside:avoid}a{color:inherit;text-decoration:none}}@media screen{.print-bar{position:sticky;top:0;background:#fff;padding:10px 0;border-bottom:1px solid #ddd;margin-bottom:12px}}'+
    '</style></head><body><div class="print-bar no-print"><button onclick="window.print()">Print / Save as PDF</button> <span class="meta">In the print dialog, choose “Save as PDF”.</span></div>'+
    '<header><div class="meta">TRACELENS · DIGITAL FORENSICS</div><h1>Investigation Report</h1><p class="meta">Report ID: '+reportEsc(r.id)+' · Generated: '+dateText(r.generatedAt)+'</p></header>'+
    '<h2>Case Information</h2><dl><dt>Case</dt><dd>'+reportEsc(r.caseName||'Unknown')+'</dd><dt>Case ID</dt><dd class="mono">'+reportEsc(r.caseId||'Unavailable')+'</dd><dt>Status</dt><dd>'+reportEsc(r.caseStatus||'Unknown')+'</dd><dt>Description</dt><dd>'+reportEsc(r.caseDescription||'Not provided')+'</dd></dl>'+
    '<h2>Executive Summary</h2><div class="summary"><div class="metric"><b>'+reportEsc(summary.totalEvidence||0)+'</b>Total evidence</div><div class="metric"><b>'+reportEsc(summary.threats||0)+'</b>High-risk artifacts</div><div class="metric"><b>'+reportEsc(summary.listedIndicators||0)+'</b>Listed local indicators</div><div class="metric"><b>'+reportEsc(summary.suspicious||0)+'</b>Suspicious</div><div class="metric"><b>'+reportEsc(summary.highestScore||0)+'/100</b>Highest heuristic score</div></div>'+
    '<p class="notice">Verdicts are triage results based on evidence and sources actually checked. A match in the bundled demo list is not independent confirmation of malicious activity. “No known threat found” is not a guarantee that an artifact is safe.</p>'+
    '<h2>Evidence Findings</h2>'+itemsHtml+'<h2>Limitations and Scan Scope</h2><ul>'+limitations+'</ul>'+
    '<h2>Recommended Next Steps</h2><ol><li>Validate potential malicious indicators against current trusted threat-intelligence sources.</li><li>Preserve original evidence and record its SHA-256 hash and acquisition context.</li><li>Escalate high-risk findings for isolated sandbox or analyst review before taking action.</li><li>Document uncompleted checks and collect additional evidence where needed.</li></ol>'+
    '<footer>TraceLens · Generated from locally saved scan results. No findings or metrics were added beyond the saved analysis.</footer></body></html>';
  var win=window.open('','_blank');
  if(win){win.document.open();win.document.write(html);win.document.close();toast('Report opened. Choose Print / Save as PDF.');}
  else {
    var blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='TraceLens_Report_'+String(r.id).replace(/[^a-zA-Z0-9_-]/g,'_')+'.html';
    document.body.appendChild(a);a.click();a.remove();
    toast('Pop-up blocked: HTML report downloaded; open it and choose Print / Save as PDF.');
  }
}
window.downloadReport = downloadReport;

/* ==================== DEMO SEED ============================= */
function seedDemoData(){
  if(DB.cases().length){ toast('Data already exists'); return; }
  var c1 = { id:uid('CASE'), name:'Phishing Email Investigation',
    description:'Suspected credential-harvesting campaign targeting staff.', status:'Open',
    created:new Date().toISOString(), createdBy:'investigator' };
  var c2 = { id:uid('CASE'), name:'Suspicious File Triage',
    description:'Unknown executable submitted by user.', status:'Open',
    created:new Date().toISOString(), createdBy:'investigator' };
  DB.saveCases([c1, c2]);

  var cleanText = 'Quarterly financial summary. All figures reconciled. No anomalies found.';
  var cleanBytes = new TextEncoder().encode(cleanText);
  var urlText = 'http://185.220.101.45:8080/xmlrpc.php';
  var urlBytes = new TextEncoder().encode(urlText);
  var badText = 'powershell -enc SQBFAFgA invoke-expression(meterpreter) WriteProcessMemory CreateRemoteThread URLDownloadToFile WinExec HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run vssadmin delete shadows';
  var badBytes = new TextEncoder().encode(badText);
  var emailText = 'From: "PayPal Security" <security@paypa1-verify.tk>\n' +
    'Reply-To: recovery@temp-mail.xyz\n' +
    'Return-Path: <bounce@spam-relay.ru>\n' +
    'Subject: URGENT: Your account has been suspended - verify immediately\n' +
    'Authentication-Results: spf=fail dkim=fail dmarc=fail\n' +
    '\n' +
    'Dear Customer, we detected unusual activity. Please verify your account and confirm your password immediately:\n' +
    'http://paypal.secure-login-verify-account.tk/confirm?redirect=http://evil-c2.net/drop\n';
  var emailBytes = new TextEncoder().encode(emailText);

  var queue = [
    { caseId:c1.id, type:'file',  name:'financial_summary.txt', mime:'text/plain', bytes:cleanBytes, text:cleanText },
    { caseId:c1.id, type:'url',   name:urlText, mime:'text/uri-list', bytes:urlBytes, text:urlText },
    { caseId:c1.id, type:'email', name:'sample-phish.eml', mime:'message/rfc822', bytes:emailBytes, text:emailText },
    { caseId:c2.id, type:'file',  name:'payload.ps1', mime:'text/plain', bytes:badBytes, text:badText }
  ];
  var evAll = DB.evidence(), anAll = DB.analysis(), pending = queue.length;
  queue.forEach(function(q){
    sha256(q.bytes, function(hash){
      var ev = { id:uid('EV'), caseId:q.caseId, name:q.name, size:q.bytes.length,
                 mime:q.mime, type:q.type, sha256:hash,
                 uploadedAt:new Date().toISOString(), uploadedBy:'investigator' };
      evAll.push(ev);
      prepareAnalysisResult(ev, q.bytes, q.text, null, function(an){
        anAll.push(an);
        pending--;
        if(pending === 0){
          DB.saveEvidence(evAll); DB.saveAnalysis(anAll);
          toast('Sample data loaded'); navigate('dashboard');
        }
      });
    });
  });
}
window.seedDemoData = seedDemoData;

/* ==================== BOOTSTRAP ============================= */
function showApp(user){
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app').classList.add('active');
  document.getElementById('hdr-user').textContent = user.name + ' - ' + user.role;
  navigate('dashboard');
}

function bootstrap(){
  console.log('[DFI] localStorage:', HAS_LS, '| sessionStorage:', HAS_SS);

  // Storage status
  var status = document.getElementById('storage-status');
  if(status){
    var ok = HAS_LS && HAS_SS;
    status.style.color = ok ? 'var(--low)' : 'var(--med)';
    status.textContent = ok ? '\u25CF Persistent storage: OK — accounts saved to this computer'
                            : '\u25CF Persistent storage blocked — in-memory mode';
  }

  // Tabs
  var tabLogin = document.getElementById('tab-login');
  var tabReg = document.getElementById('tab-register');
  var formLogin = document.getElementById('login-form');
  var formReg = document.getElementById('register-form');
  tabLogin.onclick = function(){
    tabLogin.classList.add('active'); tabReg.classList.remove('active');
    formLogin.style.display = 'block'; formReg.style.display = 'none';
  };
  tabReg.onclick = function(){
    tabReg.classList.add('active'); tabLogin.classList.remove('active');
    formLogin.style.display = 'none'; formReg.style.display = 'block';
  };

  // Login
  formLogin.onsubmit = function(ev){
    ev.preventDefault();
    var u = document.getElementById('login-user').value;
    var p = document.getElementById('login-pass').value;
    var r = Auth.login(u, p);
    if(r.ok){ document.getElementById('login-error').textContent=''; showApp(r.user); }
    else document.getElementById('login-error').textContent = r.msg;
  };

  // Register
  formReg.onsubmit = function(ev){
    ev.preventDefault();
    var u = document.getElementById('reg-user').value;
    var n = document.getElementById('reg-name').value;
    var p1 = document.getElementById('reg-pass').value;
    var p2 = document.getElementById('reg-pass2').value;
    var err = document.getElementById('reg-error');
    var ok = document.getElementById('reg-success');
    err.textContent = ''; ok.textContent = '';
    var r = Auth.register(u, n, p1, p2);
    if(!r.ok){ err.textContent = r.msg; return; }
    ok.textContent = 'Account created. Signing you in...';
    // Auto sign-in
    var li = Auth.login(u, p1);
    if(li.ok) setTimeout(function(){ showApp(li.user); }, 700);
    else { document.getElementById('tab-login').click(); document.getElementById('login-error').textContent = 'Please sign in.'; }
  };

  Auth.seed();

  var lo = document.getElementById('logout-btn');
  if(lo) lo.onclick = function(){ Auth.logout(); location.reload(); };

  var links = document.querySelectorAll('aside a');
  for(var i=0;i<links.length;i++){ (function(a){ a.onclick=function(){ navigate(a.dataset.route); }; })(links[i]); }

  if(overlay) overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

  // Auto-signin if session exists
  var existing = Auth.current();
  if(existing) showApp(existing);

  // PWA install prompt
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault();
    window.__deferredInstallPrompt = ev;
    if(document.getElementById('install-banner-slot')) renderInstallBanner();
  });

  console.log('[DFI] Bootstrap complete.');
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
else bootstrap();

})();
</script>
